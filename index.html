<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>구내식단 운영판</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* 저장해둔 화면 밝기를 CSS보다 먼저 적용해 깜빡임을 막는다. 'auto'(기본)는 속성을 두지 않아
   기기의 다크모드 설정을 그대로 따라간다. */
try{ var _tm = localStorage.getItem('meal_app_theme_mode');
  if(_tm==='light' || _tm==='dark') document.documentElement.setAttribute('data-theme', _tm);
}catch(e){}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#eef1ea; --surface:#ffffff; --surface-2:#e4e9dd; --surface-3:#dbe2d2;
    --ink:#1c2318; --ink-soft:#59634f; --ink-faint:#8a9280;
    --border:#d3dac6; --border-soft:#e2e7d8;
    --accent:#2e6b4f; --accent-ink:#ffffff; --accent-soft:#dbeadf; --accent-strong:#204d39;
    --amber:#a8672a; --amber-soft:#f2e2cd;
    --danger:#ac4433; --danger-soft:#f4ddd7;
    --shadow: 0 1px 2px rgba(28,35,24,.06), 0 6px 20px -10px rgba(28,35,24,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160f; --surface:#1a2016; --surface-2:#222b1c; --surface-3:#2b3524;
      --ink:#e8ecdf; --ink-soft:#aab39c; --ink-faint:#77806a;
      --border:#333e2a; --border-soft:#293120;
      --accent:#6fbe93; --accent-ink:#0c1a10; --accent-soft:#213a29; --accent-strong:#8ad4ac;
      --amber:#dba05b; --amber-soft:#3a2c18;
      --danger:#df8b7a; --danger-soft:#3c221c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160f; --surface:#1a2016; --surface-2:#222b1c; --surface-3:#2b3524;
    --ink:#e8ecdf; --ink-soft:#aab39c; --ink-faint:#77806a;
    --border:#333e2a; --border-soft:#293120;
    --accent:#6fbe93; --accent-ink:#0c1a10; --accent-soft:#213a29; --accent-strong:#8ad4ac;
    --amber:#dba05b; --amber-soft:#3a2c18;
    --danger:#df8b7a; --danger-soft:#3c221c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,sans-serif;font-size:14px;line-height:1.5;}
  .num{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums;}
  h1,h2,h3{text-wrap:balance;margin:0;font-family:"IBM Plex Sans KR",sans-serif;}
  button{font-family:inherit;font-size:inherit;}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  ::selection{background:var(--accent-soft);}

  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{width:238px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;}
  .brand-text{display:flex;flex-direction:column;line-height:1.25;}
  .brand-text b{font-size:13.5px;font-weight:700;}
  .brand-text span{font-size:11px;color:var(--ink-faint);}
  .navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:none;background:transparent;color:var(--ink-soft);text-align:left;cursor:pointer;font-weight:500;transition:background .12s,color .12s;}
  .navbtn svg{width:18px;height:18px;flex:none;}
  .navbtn:hover{background:var(--surface-2);color:var(--ink);}
  .navbtn.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;}
  .nav-sep{height:1px;background:var(--border-soft);margin:10px 4px;}
  /* 메뉴 묶음 — 식단(대시보드·영업부·용역부) / 관리 / 설정을 눈으로 구분한다 */
  .navgroup{display:flex;flex-direction:column;gap:2px;}
  .nav-group-label{padding:2px 10px 6px;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--ink-faint);}
  .navbtn.nav-primary{padding:11px 10px;margin-bottom:2px;align-items:flex-start;}
  .navbtn.nav-primary svg{width:19px;height:19px;margin-top:1px;}
  .navbtn.nav-primary .nav-label{display:flex;flex-direction:column;gap:2px;line-height:1.3;}
  .navbtn.nav-primary .nav-sub{font-size:10.5px;font-weight:500;color:var(--ink-faint);}
  .navbtn.nav-primary.active .nav-sub{color:var(--accent-strong);opacity:.75;}

  /* ---------- 부서 구역 ----------
   * 영업부와 용역부를 각각 테두리로 감싼 별도 '칸'으로 보여준다.
   * 칸 배경은 --surface 그대로 두어야 활성 메뉴의 --accent-soft 하이라이트가 묻히지 않는다.
   * 구분은 왼쪽 색막대 + 부서명 라벨 + 칸 사이 여백이 담당한다. */
  .navgroup-dept{
    position:relative;
    padding:11px 9px 10px 13px;
    margin:7px 0;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--surface);
    gap:2px;
  }
  .navgroup-dept::before{
    content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;
    border-radius:12px 0 0 12px;background:var(--dept-bar);
  }
  .nav-dept-label{
    display:flex;align-items:center;gap:7px;
    padding:0 2px 8px;
    font-size:11.5px;font-weight:700;letter-spacing:.07em;
    color:var(--dept-ink);
  }
  .nav-dept-label::after{content:"";flex:1;height:1px;background:var(--border-soft);}
  .navgroup-dept .navbtn.nav-primary{padding:9px 9px;margin-bottom:0;}
  .dept-sales  {--dept-bar:var(--accent);--dept-ink:var(--accent-strong);}
  .dept-service{--dept-bar:var(--amber); --dept-ink:var(--amber);}
  .sidebar-foot{margin-top:auto;padding:10px 8px 4px;font-size:11px;color:var(--ink-faint);border-top:1px solid var(--border-soft);}
  /* 화면 밝기(테마) 선택 — 자동은 기기 설정을 따라가고, 밝게/어둡게는 이 브라우저에 기억된다 */
  .sidebar-bottom{margin-top:auto;}
  .sidebar-bottom .sidebar-foot{margin-top:0;}
  .theme-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:0 4px;}
  .theme-toggle button{flex:1;border:none;background:var(--surface);color:var(--ink-soft);padding:5px 0;font-size:10.5px;font-weight:600;cursor:pointer;}
  .theme-toggle button + button{border-left:1px solid var(--border);}
  .theme-toggle button.active{background:var(--accent);color:var(--accent-ink);}
  .theme-label{padding:0 6px 4px;font-size:10px;color:var(--ink-faint);}

  /* ---------- Main ---------- */
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  #topbar .title-block h1{font-size:19px;font-weight:700;}
  #topbar .title-block p{margin:2px 0 0;color:var(--ink-soft);font-size:12.5px;}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;}
  .chip.green{background:var(--accent-soft);color:var(--accent-strong);}
  .chip.amber{background:var(--amber-soft);color:var(--amber);}
  .chip.red{background:var(--danger-soft);color:var(--danger);}
  .chip.gray{background:var(--surface-2);color:var(--ink-soft);}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}

  #view{padding:24px 28px 60px;max-width:1180px;width:100%;margin:0 auto;}
  .view-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .view-head h2{font-size:16px;font-weight:700;}
  .view-head p{margin:3px 0 0;color:var(--ink-soft);font-size:12.5px;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:14px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .card.tight{padding:14px;}
  .stat-tile{display:flex;flex-direction:column;gap:6px;}
  .stat-tile .label{font-size:12px;color:var(--ink-soft);font-weight:500;}
  .stat-tile .value{font-size:22px;font-weight:700;font-family:"IBM Plex Mono",monospace;}
  .stat-tile .sub{font-size:11.5px;color:var(--ink-faint);}

  .section-title{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .section-title .hint{font-weight:400;color:var(--ink-faint);font-size:11.5px;}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:600;font-size:12.8px;transition:filter .1s,background .1s;white-space:nowrap;}
  .btn:hover{filter:brightness(0.97);}
  :root[data-theme="dark"] .btn:hover, @media (prefers-color-scheme:dark){.btn:hover{filter:brightness(1.12);}}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn.small{padding:5px 10px;font-size:11.5px;border-radius:7px;}
  .btn.danger{color:var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .iconbtn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);cursor:pointer;}
  .iconbtn:hover{background:var(--surface-2);}

  /* ---------- Forms ---------- */
  label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);font-weight:600;}
  input[type=text],input[type=number],input[type=date],select,textarea{padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  select.slot-select{width:100%;}
  .inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}

  /* ---------- Table ---------- */
  .twrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  thead th{background:var(--surface-2);font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.wrap,th.wrap{white-space:normal;}
  td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}

  /* ---------- Meal plan week ---------- */
  .weeknav{display:flex;align-items:center;gap:10px;}
  .weeknav .range{font-weight:700;font-size:14px;min-width:150px;text-align:center;}
  .cat-toggle{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .cat-toggle button{border:none;background:var(--surface);color:var(--ink-soft);padding:7px 16px;font-weight:600;font-size:12.8px;cursor:pointer;}
  .cat-toggle button.active{background:var(--accent);color:var(--accent-ink);}

  .daygrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;}
  .daycard{min-width:0;}
  .daycard input,.daycard select{min-width:0;max-width:100%;}
  @media (max-width:980px){.daygrid{grid-template-columns:1fr;}}
  .daycard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;}
  .daycard.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--shadow);}
  .daycard .dhead{display:flex;align-items:center;justify-content:space-between;}
  .daycard .dhead .d{font-weight:700;font-size:13.5px;}
  .daycard .dhead .m{font-size:11px;color:var(--ink-faint);}
  .slot-row{display:flex;flex-direction:column;gap:3px;}
  .slot-row .slabel{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .daycost{margin-top:auto;padding-top:8px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;align-items:baseline;font-size:12px;}
  .daycost b{font-family:"IBM Plex Mono",monospace;font-size:14px;}
  .delivery-box{background:var(--amber-soft);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .memo-input{border:1px dashed var(--border);background:transparent;border-radius:6px;padding:5px 7px;font-size:11.5px;width:100%;}

  .snack-table td input{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 5px;}
  .snack-table td input:hover,.snack-table td input:focus{border-color:var(--border);background:var(--surface);}

  /* ---------- Menu manager ---------- */
  .menu-editor{display:grid;grid-template-columns:1.1fr 1.6fr;gap:16px;}
  @media (max-width:940px){.menu-editor{grid-template-columns:1fr;}}
  .ing-row{display:grid;grid-template-columns:1.5fr .7fr .6fr .8fr auto;gap:6px;align-items:center;margin-bottom:6px;}
  .ing-row input,.ing-row select{width:100%;}
  .badge-cat{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--ink-soft);}
  .badge-theme{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}
  .filterbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .filterbar select,.filterbar input{padding:6px 9px;}
  .ing-link-row{display:grid;grid-template-columns:1.3fr 1fr .55fr auto;gap:6px;align-items:center;margin-bottom:6px;}
  .ing-link-row select,.ing-link-row input{width:100%;}
  .badge-ingcat{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--ink-soft);}

  /* ---------- 재료·상품 관리 ---------- */
  .ing-editor{display:grid;grid-template-columns:1fr 1.7fr;gap:16px;}
  @media (max-width:940px){.ing-editor{grid-template-columns:1fr;}}

  /* ---------- 월간 캘린더 보기 ---------- */
  .monthgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  @media (max-width:900px){.monthgrid{grid-template-columns:1fr;}}
  .monthcell{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:border-color .12s;}
  .monthcell:hover{border-color:var(--accent);}
  .monthcell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .monthcell .mc-head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;}
  .monthcell .mc-body{font-size:11px;color:var(--ink-soft);line-height:1.5;}
  /* 월간 보기 — 메뉴를 쉼표로 잇지 않고 분류(밥·국·메인·반찬)별로 한 줄씩 끊어 보여준다.
   * 왼쪽 색막대는 인쇄물과 같은 분류색을 써서, 화면과 인쇄물의 색이 서로 어긋나지 않게 한다. */
  .monthcell .mc-line{display:flex;align-items:baseline;gap:6px;padding:1px 0 1px 7px;
    border-left:3px solid var(--border);border-radius:1px;margin-bottom:3px;line-height:1.35;}
  .monthcell .mc-cat{flex:none;min-width:30px;font-size:9.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-faint);}
  .monthcell .mc-menu{font-size:11.5px;color:var(--ink);font-weight:500;word-break:keep-all;}
  .monthcell .mc-memo{margin-top:2px;padding-top:3px;border-top:1px dashed var(--border-soft);
    font-size:10.5px;color:var(--ink-faint);word-break:keep-all;}
  .monthcell .mc-cost{margin-top:auto;font-size:11px;font-family:"IBM Plex Mono",monospace;font-weight:600;}
  .monthweekrow{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .view-toggle button{border:none;background:var(--surface);color:var(--ink-soft);padding:7px 14px;font-weight:600;font-size:12.8px;cursor:pointer;}
  .view-toggle button.active{background:var(--accent);color:var(--accent-ink);}

  /* ---------- 발주 그룹/체크 ---------- */
  .order-catgroup{margin-bottom:16px;}
  .order-catgroup>.ocg-head{display:flex;align-items:center;justify-content:space-between;padding:7px 2px;font-weight:700;font-size:12.8px;}
  .done-row{opacity:.55;}
  .done-row td{text-decoration:line-through;}
  .order-progress{display:flex;align-items:center;gap:8px;}
  .order-progress .bar-bg{flex:1;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:60px;}
  .order-progress .bar-fg{height:100%;background:var(--accent);}
  .supplier-subtotal{font-size:11px;color:var(--ink-soft);background:var(--surface-2);border-radius:6px;padding:6px 9px;display:flex;justify-content:space-between;gap:10px;}

  /* ---------- misc ---------- */
  .muted{color:var(--ink-faint);}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .hr{height:1px;background:var(--border-soft);margin:14px 0;}
  .empty{padding:26px;text-align:center;color:var(--ink-faint);font-size:12.8px;}
  a.linklike{color:var(--accent-strong);cursor:pointer;font-weight:600;text-decoration:none;}
  a.linklike:hover{text-decoration:underline;}
  .barchart{width:100%;height:auto;}
  .barchart text{fill:var(--ink-soft);font-family:"IBM Plex Mono",monospace;}
  .barchart .gridline{stroke:var(--border-soft);stroke-width:1;}
  .barchart .bar{fill:var(--accent);}
  .barchart .bar.over{fill:var(--danger);}
  .barchart .target{stroke:var(--amber);stroke-width:1.6;stroke-dasharray:4 3;}

  /* ===== 인쇄용 식단표 =====
   * 화면용(편집 가능한 카드)과 인쇄용(표)을 따로 만든다. 화면에서 쓰는 드롭다운·버튼을 그대로
   * 인쇄하면 줄글처럼 늘어져 알아보기 어렵기 때문이다. 인쇄물에는 금액을 일절 넣지 않는다. */
  .printonly{display:none;}
  .printsheet{width:100%;border-collapse:collapse;table-layout:fixed;}
  .printsheet th,.printsheet td{border:1px solid #b9b9b4;padding:7px 8px;vertical-align:top;text-align:center;}
  .printsheet thead th{background:#efeee9;font-size:12.5px;line-height:1.35;padding:8px 6px;}
  .printsheet .ps-day{font-weight:800;font-size:14px;}
  .printsheet .ps-date{font-size:11px;color:#55554f;}
  .printsheet .ps-theme{display:inline-block;margin-top:3px;font-size:10px;padding:1px 7px;border-radius:99px;background:#dedcd4;color:#33332e;}
  .printsheet .ps-cat{width:92px;background:#f6f5f1;font-size:12px;font-weight:800;text-align:center;letter-spacing:.02em;}

/* ===================== 날짜 유틸 ===================== */
function pad(n){return String(n).padStart(2,'0');}
function toKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function mondayOf(d){const dt=new Date(d);const day=dt.getDay();const diff=(day===0?-6:1-day);dt.setDate(dt.getDate()+diff);dt.setHours(0,0,0,0);return dt;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function weekDates(mon){return [0,1,2,3,4].map(i=>addDays(mon,i));}
/** 금액 표시. 금액 열람 권한이 없는 계정(일반)에게는 숫자를 내보내지 않는다.
 *  앱 안의 모든 금액 출력은 이 함수 하나를 거치므로, 여기서 막으면 화면 전체에서 함께 막힌다. */
const MONEY_MASK = '••••';
function fmtWon(n){
  if(!canSeeMoney()) return MONEY_MASK;
  return Math.round(n||0).toLocaleString('ko-KR')+'원';
}
function fmtMD(d){return (d.getMonth()+1)+'.'+pad(d.getDate());}
function sameDate(a,b){return toKey(a)===toKey(b);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/** db 스냅샷의 data()는 frozen(읽기전용) 객체이므로, 로컬에서 수정하려면 항상 깊은 복사본을 만들어 사용한다. */
function deepClone(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }

/* ===================== 커스텀 확인/알림 모달 =====================
 * 브라우저 기본 window.confirm()/alert()는 게시된 화면을 감싸는 표시 프레임에 따라
 * 조용히 막혀서 아무 일도 일어나지 않을 수 있다(사용자 입장에서는 "삭제/저장 버튼을 눌러도
 * 반응이 없다"로 보임). 항상 동일하게 동작하도록 직접 그리는 모달로 대체한다. */
function showModal(message, buttons){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    const btnWrap = document.getElementById('modalBtns');
    btnWrap.innerHTML = '';
    function close(result){ overlay.hidden = true; resolve(result); }
    buttons.forEach(b=>{
      const el = document.createElement('button');
      el.className = 'btn' + (b.primary ? ' primary' : ' ghost');
      el.textContent = b.label;
      el.onclick = ()=>close(b.value);
      btnWrap.appendChild(el);
    });
    overlay.hidden = false;
  });
}
/** window.confirm() 대체: Promise<boolean> */
function customConfirm(message){
  return showModal(message, [
    {label:'취소', value:false},
    {label:'확인', value:true, primary:true},
  ]);
}
/** window.alert() 대체: Promise<void> */
function customAlert(message){
  return showModal(message, [{label:'확인', value:true, primary:true}]);
}
/** 사용자가 입력한 자유 텍스트를 onclick="...('...')" 처럼 작은따옴표로 감싼 JS 문자열 인자로
 *  안전하게 넣기 위한 이스케이프. esc()만으로는 HTML 속성 파싱 단계는 보호되지만, 그 안의 JS
 *  문자열 리터럴 경계(작은따옴표)는 보호되지 않아 이름에 '가 들어가면 깨질 수 있어 별도로 처리한다. */
function escJsAttr(s){ return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
/** showModal과 같은 모달 상자를 쓰되, 안내문 자리에 임의의 입력 폼(HTML)을 넣을 수 있는 버전.
 *  버튼의 value가 함수이면 클릭 시점에 호출해 폼 값을 읽어 그 반환값으로 Promise를 resolve한다. */
function showFormModal(bodyHtml, buttons){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    const msgEl = document.getElementById('modalMsg');
    msgEl.innerHTML = bodyHtml;
    const btnWrap = document.getElementById('modalBtns');
    btnWrap.innerHTML = '';
    function close(result){ overlay.hidden = true; resolve(result); }
    buttons.forEach(b=>{
      const el = document.createElement('button');
      el.className = 'btn' + (b.primary ? ' primary' : ' ghost');
      el.textContent = b.label;
      el.onclick = ()=>close(typeof b.value==='function' ? b.value() : b.value);
      btnWrap.appendChild(el);
    });
    overlay.hidden = false;
    const firstInput = msgEl.querySelector('input,select,textarea');
    if(firstInput) firstInput.focus();
  });
}
const MODAL_INPUT_STYLE = 'width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;';
/** 새 이름 하나만 입력받는 프롬프트. 취소하면 null. */
function customPromptText(message, placeholder){
  const bodyHtml = `<div style="margin-bottom:10px;">${esc(message)}</div><input id="modalPromptInput" type="text" placeholder="${esc(placeholder||'')}" style="${MODAL_INPUT_STYLE}">`;
  return showFormModal(bodyHtml, [
    {label:'취소', value:null},
    {label:'추가', primary:true, value:()=>{ const v=document.getElementById('modalPromptInput').value.trim(); return v || null; }},
  ]);
}
/** 새 테마(데이) 추가용 프롬프트 — 이름 + 표시 색상. 취소하면 null, 성공하면 {name,color}. */
function promptNewTheme(){
  const colorLabel = {gray:'회색', green:'초록', amber:'주황', red:'빨강'};
  const bodyHtml = `
    <div style="margin-bottom:10px;">새 테마(데이) 이름을 입력하세요. 예: 튀김데이</div>
    <input id="modalPromptInput" type="text" placeholder="예: 튀김데이" style="${MODAL_INPUT_STYLE}margin-bottom:10px;">
    <label style="font-size:12.5px;color:var(--ink-soft);">표시 색상<br>
      <select id="modalPromptColor" style="margin-top:4px;padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);">
        ${THEME_COLOR_CHOICES.map(c=>`<option value="${c}">${colorLabel[c]||c}</option>`).join('')}
      </select>
    </label>`;
  return showFormModal(bodyHtml, [
    {label:'취소', value:null},
    {label:'추가', primary:true, value:()=>{
      const name = document.getElementById('modalPromptInput').value.trim();
      const color = document.getElementById('modalPromptColor').value;
      return name ? {name, color} : null;
    }},
  ]);
}

/* ---- 메뉴 재료 행(ingredient row) 계산 유틸 -----------------------------------------
 * 기존 데이터 호환: ingId/calcMode/refHeadcount가 없는 예전 재료 행은 각각
 * ''(직접입력), 'perPerson', 1 로 취급되어 예전 계산식과 완전히 동일하게 동작한다. */
function ingredientById(id){ return S.ingredients.find(x=>x.id===id); }

/* ---------- 단위 환산 ----------
 * 메뉴에 적는 수량의 단위(예: g)와 재료·상품에 등록한 기본단위(예: kg)가 다를 수 있다.
 * 예전에는 이 둘을 그대로 곱해서, "양파 30g"이 30kg으로 계산되어 원가가 1000배로 튀었다.
 * 무게(g↔kg)와 부피(ml↔L)는 여기서 자동으로 맞춘다. 개·봉·판처럼 환산 기준이 없는 단위는
 * 서로 바꿀 수 없으므로 예전과 똑같이 그대로 둔다(임의로 추정하지 않는다). */
const UNIT_BASE_SCALE = {g:1, kg:1000, ml:1, L:1000};
const UNIT_FAMILY = {g:'mass', kg:'mass', ml:'volume', L:'volume'};
/** fromU 1 = toU 몇 개? 환산할 수 없으면 null */
function unitConvFactor(fromU, toU){
  if(!fromU || !toU) return null;
  if(fromU === toU) return 1;
  if(UNIT_FAMILY[fromU] && UNIT_FAMILY[fromU] === UNIT_FAMILY[toU]){
    return UNIT_BASE_SCALE[fromU] / UNIT_BASE_SCALE[toU];
  }
  return null;
}
/** 메뉴 재료 한 줄의 수량을 "연결된 재료의 기본단위"로 바꾸는 배수. 연결이 없거나 환산 불가면 1. */
function ingRowBaseFactor(ing){
  if(!ing || !ing.ingId) return 1;
  const reg = ingredientById(ing.ingId);
  if(!reg) return 1;
  const f = unitConvFactor(ing.u, reg.baseUnit);
  return (f === null) ? 1 : f;
}
/** 재료 1 기본단위당 단가(원).
 *  - 재료·상품 관리에 연결된(ingId) 경우: 실제 구매가 ÷ 구매수량으로 환산(가장 정확).
 *  - 직접입력(레거시 포함)인 경우: g·ml 은 예전 방식 그대로 "원/kg·L" 단가 입력(하위호환, 절대 변경 금지),
 *    그 외 단위(개·kg·L·봉·팩·통·판·모·박스·묶음)는 "해당 단위 1개당 가격"으로 입력한다. */
function ingRowUnitCost(ing){
  if(ing.ingId){
    const reg = ingredientById(ing.ingId);
    if(reg){
      if(!reg.purchaseQty) return 0;
      const perBase = (reg.purchasePrice||0)/reg.purchaseQty;   // 기본단위 1개당 가격
      return perBase * ingRowBaseFactor(ing);                    // 메뉴에 적은 단위 1개당 가격
    }
  }
  if(ing.u==='g' || ing.u==='ml') return (ing.p||0)/1000;
  return (ing.p||0);
}
/** 인원비례 재료의 "1인당" 필요량. calcMode 없으면 perPerson, refHeadcount 없으면 1(=예전 방식과 동일) */
function ingRowPerPersonQty(ing){
  const mode = ing.calcMode || 'perPerson';
  if(mode==='fixed') return 0;
  const ref = ing.refHeadcount || 1;
  return (ing.q||0) / ref;
}
/** 고정수량 재료(인원수와 무관하게 항상 이 양만큼)의 절대 필요량 */
function ingRowFixedQty(ing){ return (ing.calcMode==='fixed') ? (ing.q||0) : 0; }
/** 메뉴 1인 기준 원가. headcount는 고정수량 재료비를 인원수로 나눠 배분할 때만 사용(생략 시 현재 설정 인원). */
function menuCost(menu, headcount){
  if(!menu || !menu.ingredients) return 0;
  const hc = headcount || (S.settings && S.settings.headcount) || 1;
  return menu.ingredients.reduce((sum,ing)=>{
    const unitCost = ingRowUnitCost(ing);
    const perPerson = ingRowPerPersonQty(ing);
    const fixed = ingRowFixedQty(ing);
    return sum + perPerson*unitCost + (fixed*unitCost)/hc;
  },0);
}

function handlerName(el){
  const src = el.getAttribute('onclick') || el.getAttribute('onchange') || el.getAttribute('oninput') || '';
  const m = src.match(/^\s*(window\.print|[A-Za-z_$][\w$]*)/);

/** render() 직후 호출 — 보기 전용 계정 화면에서 조작 요소를 제거·비활성화한다. */
function applyPermissionGuards(){
  const view = document.getElementById('view');
  if(!view) return;
  if(!isReadOnly()) return;
  view.querySelectorAll('button, input, select, textarea, a.linklike').forEach(el=>{
    const fn = handlerName(el);
    if(fn && VIEW_ONLY_HANDLERS.has(fn)) return;
    const tag = el.tagName.toLowerCase();
    if(tag === 'button' || tag === 'a'){
      el.setAttribute('hidden','');
      el.removeAttribute('onclick');
    } else {
      el.setAttribute('disabled','');
      el.classList.add('ro-off');
      el.removeAttribute('onchange');
      el.removeAttribute('oninput');
    }
  });
}

/* ---------- Firebase 로딩 ---------- */
function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error('스크립트를 불러오지 못했습니다: '+src));
    document.head.appendChild(s);
  });
}
/** Firebase v8(compat) SDK만 사용한다. v9(모듈러)는 snapshot.exists가 함수로 바뀌어
 *  이 앱의 수십 군데(if(!snap.exists) …)가 전부 깨지므로 절대 올리지 말 것. */
async function loadFirebaseSdk(){
  const base = 'https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VERSION+'/';
  await loadScript(base+'firebase-app.js');
  await Promise.all([ loadScript(base+'firebase-auth.js'), loadScript(base+'firebase-firestore.js') ]);
}

/* ---------- 회원 문서 ---------- */
function usersCol(){ return db.collection('users'); }
function normalizeUser(raw, uid){
  const u = {...(raw||{})};
  u.uid    = uid || u.uid || '';
  u.email  = u.email || '';
  u.username = u.username || toDisplayId(u.email);
  u.name   = u.name || u.username || '(이름 없음)';
  u.dept   = u.dept || '';
  u.role   = (u.role === 'admin' || u.role === 'editor') ? u.role : 'general';
  u.status = (u.status === 'approved' || u.status === 'rejected') ? u.status : 'pending';
  return u;
}
function isBootstrapAdmin(email){
  return BOOTSTRAP_ADMIN_EMAILS.map(e=>e.toLowerCase()).includes(String(email||'').toLowerCase());
}
async function fetchMyUserDoc(user){
  const snap = await db.doc('users/'+user.uid).get();
  if(snap.exists) return normalizeUser(snap.data(), user.uid);
  return null;
}
/** 가입 직후 회원 문서를 만든다. 최초 관리자 이메일이면 승인 절차 없이 바로 관리자로 들어간다.
 *  이미 문서가 있으면 절대 덮어쓰지 않는다(승인 상태·권한이 초기화되면 안 되므로). */
async function createMyUserDoc(user, name, dept){
  const existing = await fetchMyUserDoc(user);
  if(existing) return existing;
  const boot = isBootstrapAdmin(user.email);
  const rec = {
    uid: user.uid,
    email: user.email || '',
    username: toDisplayId(user.email || ''),
    name: name || toDisplayId(user.email || '') || '',
    dept: dept || '',
    role: boot ? 'admin' : 'general',
    status: boot ? 'approved' : 'pending',
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  await db.doc('users/'+user.uid).set(rec);
  return normalizeUser(rec, user.uid);
}

    'auth/invalid-credential'   : '아이디 또는 비밀번호가 맞지 않습니다.',

  };
  return map[code] || (e && e.message) || '처리 중 문제가 발생했습니다.';

async function submitAuth(){
  if(authBusy) return;
  const idInput = authEl('authEmail').value.trim();
  const pw    = authEl('authPw').value;
  const name  = authEl('authName').value.trim();
  const dept  = authEl('authDept').value.trim();
  if(!idInput || !pw){ showAuthMsg('아이디와 비밀번호를 입력해 주세요.'); return; }
  if(authMode === 'signup'){
    if(!name){ showAuthMsg('이름을 입력해 주세요.'); return; }
    if(!idInput.includes('@') && !USERNAME_RE.test(idInput.toLowerCase())){
      showAuthMsg('아이디는 영문 소문자·숫자 3~20자로 만들어 주세요. (. _ - 사용 가능)');
      return;
    }
    if(pw.length < 6){ showAuthMsg('비밀번호는 6자 이상이어야 합니다.'); return; }
  }
  const email = toLoginEmail(idInput);
  authBusy = true;
  authEl('authSubmit').disabled = true;
  authEl('authSubmit').textContent = '처리 중…';
  showAuthMsg('');
  try{
    if(authMode === 'signup'){
      // 계정이 만들어지는 순간 onAuthStateChanged가 먼저 실행되므로, 이름·부서를 미리 넘겨둔다.
      pendingSignup = {name, dept};
      await fbAuth.createUserWithEmailAndPassword(email, pw);
    } else {
      await fbAuth.signInWithEmailAndPassword(email, pw);
    }
    // 이후 처리는 onAuthStateChanged가 이어받는다.
  }catch(e){
    showAuthMsg(authErrorMessage(e));
  }finally{
    authBusy = false;
    authEl('authSubmit').disabled = false;
    authEl('authSubmit').textContent = authMode==='signup' ? '가입 신청' : '로그인';
  }
}

/* ===================== 회원 관리 화면(관리자 전용) ===================== */
async function loadUsers(){
  if(!AUTH_ENABLED || !db){ usersCache = []; return; }
  const snap = await usersCol().get();
  usersCache = snap.docs.map(d=>normalizeUser(d.data(), d.id))
    .sort((a,b)=>{
      const order = {pending:0, approved:1, rejected:2};
      if(order[a.status] !== order[b.status]) return order[a.status]-order[b.status];
      return (a.name||'').localeCompare(b.name||'', 'ko');
    });
}
async function setUserStatus(uid, status){
  if(!isAdmin()) return;
  if(uid === (ME && ME.uid) && status !== 'approved'){
    await customAlert('본인 계정의 이용을 제한할 수는 없습니다.');
    return;
  }
  await db.doc('users/'+uid).set({...(usersCache.find(u=>u.uid===uid)||{}), status, updatedAt: Date.now(), approvedBy: ME ? ME.email : ''});
  await loadUsers();
  render();
}
async function setUserRole(uid, role){
  if(!isAdmin()) return;
  if(!['general','editor','admin'].includes(role)) return;
  const cur = usersCache.find(u=>u.uid===uid);
  if(uid === (ME && ME.uid) && role !== 'admin'){
    if(!await customConfirm('본인 권한을 "'+ROLE_LABEL[role]+'"으로 낮추면 이 회원 관리 화면에 다시 들어올 수 없습니다.\n계속할까요?')) { render(); return; }
  }
  await db.doc('users/'+uid).set({...(cur||{}), role, updatedAt: Date.now()});
  await loadUsers();
  if(uid === (ME && ME.uid)){
    ME.role = role;
    renderMeBox();
    applyNavPermissions();
    if(!canViewTab(activeTab)){ setTab('dashboard'); return; }

  render();
}
async function removeUser(uid){

/* ---------- 데이터 백업 · 이관(관리자 전용) ----------
 * 이 앱은 "데이터를 파일에 넣어 배포"하지 않는다(공개 저장소에 단가·거래처가 노출되므로).
 * 대신 관리자가 JSON 파일 하나로 내보내고, 새 데이터베이스에 그대로 가져온다. */
const DATA_COLLECTIONS = ['menus','ingredients','suppliers','orders','menuSets','serviceMenus','mealPlan','serviceMeals','stock'];
let dataBusy = false;
function setDataStatus(text){
  const el = document.getElementById('dataStatus');
  if(el){ el.textContent = text || ''; el.hidden = !text; }
}
async function exportAllData(){
  if(!db || dataBusy) return;
  dataBusy = true; setDataStatus('내보내는 중…');
  try{
    const out = {exportedAt:new Date().toISOString(), settings:null, collections:{}};
    const cfg = await db.doc('settings/config').get();
    out.settings = cfg.exists ? deepClone(cfg.data()) : null;
    for(const col of DATA_COLLECTIONS){
      const snap = await db.collection(col).get();
      out.collections[col] = snap.docs.map(d=>({id:d.id, data:deepClone(d.data())}));
    }
    const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'meal-data-' + toKey(new Date()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    const n = Object.values(out.collections).reduce((s,v)=>s+v.length,0);
    setDataStatus('내보내기 완료 — 문서 ' + n + '건');
  }catch(e){
    setDataStatus('내보내기 실패: ' + ((e && e.message)||e));
  }finally{ dataBusy = false; }
}
async function importAllData(input){
  if(!db || dataBusy) return;
  const file = input && input.files && input.files[0];
  if(!file) return;
  const mode = await showModal(
    '"'+file.name+'" 를 가져옵니다.\n\n' +
    '· 이 파일로 맞추기 — 파일에 없는 기존 항목은 지웁니다(다른 곳에서 옮겨올 때 권장)\n' +
    '· 합치기 — 기존 항목은 그대로 두고, 같은 항목만 파일 내용으로 덮어씁니다',
    [
      {label:'취소', value:'cancel'},
      {label:'합치기', value:'merge'},
      {label:'이 파일로 맞추기', value:'replace', primary:true},
    ]);
  if(mode === 'cancel' || !mode){ input.value=''; return; }
  dataBusy = true; setDataStatus('가져오는 중…');
  try{
    const parsed = JSON.parse(await file.text());
    if(!parsed || !parsed.collections) throw new Error('이 앱에서 내보낸 파일이 아닙니다.');
    let n = 0, removed = 0;
    if(parsed.settings){ await db.doc('settings/config').set({...parsed.settings, snapshotSeeded:true}); n++; }
    for(const col of DATA_COLLECTIONS){
      const rows = parsed.collections[col] || [];
      if(mode === 'replace'){
        // 파일에 없는 기존 문서는 지워서, 예시 데이터나 예전 기록이 섞이지 않게 한다.
        const keep = new Set(rows.map(r=>r.id));
        const cur = await db.collection(col).get();
        for(const d of cur.docs){ if(!keep.has(d.id)){ await db.collection(col).doc(d.id).delete(); removed++; } }
      }
      for(const r of rows){ await db.collection(col).doc(r.id).set(r.data); n++; }
    }
    // 가져온 내용으로 앱 상태를 다시 불러온다(새로고침 없이 바로 반영).
    S.mealPlan = {};
    S.serviceMeals = {};
    await loadCore();
    rebuildCatsThemes();
    await ensureWeekLoaded(currentWeekMonday);
    await render();
    setDataStatus('가져오기 완료 — 문서 ' + n + '건' + (removed ? ' (파일에 없던 ' + removed + '건 삭제)' : ''));
  }catch(e){
    setDataStatus('가져오기 실패: ' + ((e && e.message)||e));
  }finally{ dataBusy = false; input.value = ''; }
}

/* ===================== 데이터 저장소 ===================== */
async function initDb(){
  // 1순위: Firebase(회원가입·승인·권한 사용). FIREBASE_CONFIG가 채워져 있을 때만.
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.projectId){
    try{
      await loadFirebaseSdk();
      if(!window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
      db = window.firebase.firestore();
      // Firestore는 undefined 값을 거부하므로, 예전 데이터에 빈 필드가 섞여 있어도 저장되도록 무시 설정.
      try{ db.settings({ ignoreUndefinedProperties: true }); }catch(e){}
      fbAuth = window.firebase.auth();
      AUTH_ENABLED = true;
      return;
    }catch(e){
      console.error('[meal] Firebase 연결 실패 — 로그인 없이 브라우저 저장 모드로 넘어갑니다.', e);
      db = null; fbAuth = null; AUTH_ENABLED = false;
    }
  }
  // 2순위: Claude Artifact 내장 저장소(예전 운영판과 동일)
  try{ db = (window.claude && await window.claude.use('db')) || null; }
  catch(e){ db = null; }
  if(db) return;
  // 3순위: 브라우저 저장소. Firebase를 연결하기 전에도 혼자 열어볼 수 있게 하는 용도이며,
  // 이 모드에서는 로그인·권한이 동작하지 않고 데이터도 그 브라우저에만 남는다.
  db = makeLocalDb();
}
/** Firestore v8 / Artifact db와 같은 모양(doc/collection/get/set/delete/add/orderBy/limit)을 흉내 내는
 *  localStorage 기반 임시 저장소. 앱의 다른 코드는 저장소 종류를 전혀 몰라도 되도록 여기서만 다룬다. */
function makeLocalDb(){
  const KEY = 'meal_app_local_db';
  let mem = {};
  try{ mem = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ mem = {}; }
  const flush = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} };
  const rid = ()=> 'loc_' + Math.random().toString(36).slice(2,10);
  const docApi = (path)=>({
    get: async ()=>{
      const v = mem[path];
      return { exists: v !== undefined, id: path.split('/').pop(), data: ()=>deepClone(v) };
    },
    set: async (val)=>{ mem[path] = deepClone(val); flush(); },
    delete: async ()=>{ delete mem[path]; flush(); },
  });
  const colApi = (col)=>{
    const rows = ()=> Object.keys(mem)
      .filter(k=>k.startsWith(col+'/') && k.slice(col.length+1).indexOf('/') === -1)
      .map(k=>({ id: k.slice(col.length+1), data: ()=>deepClone(mem[k]), _raw: mem[k] }));
    const q = (list)=>({
      get: async ()=>({ docs: list() }),
      orderBy: (f, dir)=> q(()=>{
        const arr = list().slice().sort((a,b)=>{
          const av=(a._raw||{})[f], bv=(b._raw||{})[f];
          return av === bv ? 0 : (av > bv ? 1 : -1);
        });
        return dir === 'desc' ? arr.reverse() : arr;
      }),
      limit: (n)=> q(()=> list().slice(0, n)),
    });
    return {
      ...q(rows),
      doc: (id)=> docApi(col+'/'+id),
      add: async (val)=>{ const id = rid(); mem[col+'/'+id] = deepClone(val); flush(); return {id}; },
    };
  };
  return { doc: docApi, collection: colApi, __local: true };
}
/** 빌드할 때 실제 운영 데이터 스냅샷을 넣어두는 자리(`build_dist.js --data meal-data.json`).
 *  값이 들어 있으면, 데이터베이스가 비어 있을 때 예시 시드 대신 이 내용이 그대로 들어간다.
 *  공개 저장소에 올리는 파일에는 절대 넣지 않는다(단가·거래처가 그대로 노출되므로). */
const PRELOADED_DATA = null;
/** 스냅샷을 그대로 기록한다(설정 + 전 컬렉션).
 *  `snapshotSeeded` 표시를 함께 남긴다 — 이 표시가 있으면 예전 Artifact용 보정(ensureExtra*)을
 *  건너뛴다. 그러지 않으면 사용자가 지운 메뉴·재료가 다음 접속 때 되살아난다. */
async function seedFromSnapshot(snapshot){
  if(snapshot.settings) await db.doc('settings/config').set({...snapshot.settings, snapshotSeeded:true});
  const cols = snapshot.collections || {};
  for(const col of Object.keys(cols)){
    const rows = cols[col] || [];
    await Promise.all(rows.map(r=>db.collection(col).doc(r.id).set(r.data)));
  }
}
async function ensureSeeded(){
  if(db){
    const snap = await db.doc('settings/config').get();
    if(!snap.exists){
      if(PRELOADED_DATA){ await seedFromSnapshot(PRELOADED_DATA); return; }
      const settings = buildSeedSettings();
      const menus = buildSeedMenus();
      const mealPlan = buildSeedMealPlan(currentWeekMonday);
      const {suppliers, orders} = buildSeedOrdersAndSuppliers();
      const ingredients = buildSeedIngredients();
      await db.doc('settings/config').set(settings);
      await Promise.all(menus.map(m=>db.collection('menus').doc(m.id).set(m)));
      await Promise.all(Object.entries(mealPlan).map(([k,v])=>db.doc('mealPlan/'+k).set(v)));
      await Promise.all(suppliers.map(s=>db.collection('suppliers').doc(s.id).set(s)));
      await Promise.all(orders.map(o=>db.collection('orders').doc(o.id).set(o)));
      await Promise.all(ingredients.map(i=>db.collection('ingredients').doc(i.id).set(i)));
    }
  } else {
    S.settings = buildSeedSettings();
    S.menus = buildSeedMenus();
    S.mealPlan = buildSeedMealPlan(currentWeekMonday);
    const {suppliers, orders} = buildSeedOrdersAndSuppliers();
    S.suppliers = suppliers;
    S.orders = orders;
    S.ingredients = buildSeedIngredients();
  }
}

  const [settingsSnap, menuSnap, orderSnap, supSnap, ingSnap, setSnap, svcSnap] = await Promise.all([
    db.doc('settings/config').get(),
    db.collection('menus').get(),
    db.collection('orders').orderBy('startDate','desc').limit(40).get(),
    db.collection('suppliers').get(),
    db.collection('ingredients').get(),
    db.collection('menuSets').get(),
    db.collection('serviceMenus').get(),

  S.settings = deepClone(settingsSnap.data());
  S.menus = menuSnap.docs.map(d=>({id:d.id,...deepClone(d.data())}));

/* ===================== 세트메뉴(menuSets) 저장소 =====================
 * 세트메뉴는 "새로운 메뉴"가 아니라 기존 메뉴들의 조합(묶음)이다. 메뉴 데이터를 복제하지 않고
 * menuId 참조만 보관하므로, 재료·발주·원가는 전부 기존 메뉴 구조를 그대로 사용한다.
 * 저장 형태(SetMenu / SetMenuItem 관계를 문서 하나로 표현):
 *   menuSets/<id> = {
 *     name, description,
 *     items: [{menuId, sortOrder}, ...],   // = SetMenuItem (순서 포함)
 *     menuIds: [menuId, ...],              // items에서 파생(하위호환·조회 편의용)
 *     isActive, randomEnabled, createdAt, updatedAt
 *   }
 * v7에서 만든 예전 데이터({name, menuIds}만 있음)도 normalizeMenuSet()이 읽는 시점에
 * 자동 보정하므로 기존 세트가 그대로 살아있고, 저장할 때 새 형식으로 옮겨진다(마이그레이션). */
/** 저장된 세트 레코드를 화면·로직이 기대하는 완전한 형태로 보정한다(기존 데이터 보존용). */
function normalizeMenuSet(raw){
  const s = {...raw};
  let items = Array.isArray(s.items) ? s.items : null;
  if(!items) items = (s.menuIds||[]).map((menuId,i)=>({menuId, sortOrder:i}));
  items = items
    .filter(it=>it && it.menuId)
    .map((it,i)=>({menuId: it.menuId, sortOrder: (it.sortOrder==null ? i : it.sortOrder)}))
    .sort((a,b)=>a.sortOrder-b.sortOrder)
    .map((it,i)=>({menuId: it.menuId, sortOrder: i}));
  // 같은 메뉴가 두 번 들어간 경우 앞의 것만 남긴다(식단 중복 방지)
  const seen = new Set();
  items = items.filter(it=> seen.has(it.menuId) ? false : (seen.add(it.menuId), true))
               .map((it,i)=>({menuId: it.menuId, sortOrder: i}));
  s.items = items;
  s.menuIds = items.map(it=>it.menuId);
  s.name = s.name || '';
  s.description = s.description || '';
  s.isActive = (s.isActive===undefined) ? true : !!s.isActive;
  s.randomEnabled = (s.randomEnabled===undefined) ? true : !!s.randomEnabled;
  s.createdAt = s.createdAt || null;
  s.updatedAt = s.updatedAt || null;
  return s;
}
/** db에 실제로 저장할 필드만 추린다(id는 문서 키이므로 제외). */
function menuSetPayload(s){
  return {
    name: s.name, description: s.description,
    items: s.items, menuIds: s.menuIds,
    isActive: s.isActive, randomEnabled: s.randomEnabled,
    createdAt: s.createdAt, updatedAt: s.updatedAt,
  };
}
function menuSetById(id){ return (S.menuSets||[]).find(x=>x.id===id); }
/** 세트에 담긴 메뉴 id들을 순서대로 반환 */
function menuSetMenuIds(set){ return (set && set.items || []).map(it=>it.menuId); }
/** 세트에 실제로 존재하는 메뉴 객체들(삭제된 메뉴는 빠짐) */
function menuSetMenus(set){ return menuSetMenuIds(set).map(menuById).filter(Boolean); }
/** 세트 총 원가 = 구성 메뉴들의 기존 1인 원가 합계(세트 전용 원가는 따로 만들지 않는다) */
function menuSetCost(set){ return menuSetMenus(set).reduce((sum,m)=>sum+menuCost(m),0); }
async function addMenuSetRec(s){
  const now = new Date().toISOString();
  const rec = normalizeMenuSet({...s, createdAt: s.createdAt || now, updatedAt: now});
  const payload = menuSetPayload(rec);
  if(db){ const ref = await db.collection('menuSets').add(payload); rec.id = ref.id; }
  else { rec.id = 'local_'+Math.random().toString(36).slice(2,9); }
  S.menuSets.push(rec);
  return rec;
}
async function updateMenuSetRec(id, patch){
  const idx = S.menuSets.findIndex(x=>x.id===id);
  if(idx<0) return;
  const merged = normalizeMenuSet({...S.menuSets[idx], ...patch, updatedAt: new Date().toISOString()});
  S.menuSets[idx] = merged;
  if(db) await db.doc('menuSets/'+id).set(menuSetPayload(merged));
  return merged;
}
async function deleteMenuSetRec(id){
  S.menuSets = S.menuSets.filter(x=>x.id!==id);
  if(db) await db.doc('menuSets/'+id).delete();
}

/* ===================== 🍱 용역부(도시락) 저장소 =====================
 * 용역부는 "영업부가 전날 먹은 식단"을 하루 뒤에 도시락으로 받아먹는 구조다.
 *   용역부 월 = 사먹는 날(도시락 없음) / 화 ← 영업부 월 / 수 ← 화 / 목 ← 수 / 금 ← 목
 *   (영업부 금요일 식단은 용역부로 연결되지 않음)
 * 저장 형태:
 *   serviceMenus/<id> = {                      // 용역부 전용 추가 메뉴(ServiceAdditionalMenu)
 *     name, category('후식'|'간식'), description,
 *     qtyPerPerson, unit, costPerPerson,       // 1인 기준량·단위·1인 비용
 *     ingId,                                   // 기존 재료·상품 레지스트리 참조(실제 구매상품) — 복제하지 않음
 *     url, isActive, createdAt, updatedAt
 *   }
 *   serviceMeals/<YYYY-MM-DD> = {              // 용역부 식사일 1건(ServiceMeal)
 *     serviceDate, sourceMealDate,             // 용역부 식사일 / 연결된 영업부 식사일
 *     type('lunchbox'|'eatout'), useSourceMeal,
 *     dessertIds:[serviceMenuId], snackIds:[serviceMenuId],
 *     memo, createdAt, updatedAt
 *   }
 * 인원수·포장비·총원가는 저장하지 않고 설정값으로 항상 다시 계산한다(설정을 바꾸면 즉시 반영되도록). */
/** 용역부 인원(영업부 headcount와 절대 섞지 않는다) */
function serviceHeadcount(){ return Number(S.settings && S.settings.serviceHeadcount) || 0; }
function packagingCostPerPerson(){ return Number(S.settings && S.settings.packagingCost) || 0; }
function heatingPackCostPerPerson(){ return Number(S.settings && S.settings.heatingPackCost) || 0; }
/** 그 용역부 날짜의 성격: 월요일=사먹는 날, 화~금=도시락(전날 영업부 식단), 주말=해당 없음 */
function serviceDayType(dateKey){
  const wd = new Date(dateKey+'T00:00:00').getDay(); // 0=일 1=월 … 6=토
  if(wd===1) return 'eatout';
  if(wd>=2 && wd<=5) return 'lunchbox';
  return 'none';
}
/** 이 용역부 식사일이 어느 영업부 식사일(전날)과 연결되는지. 월요일·주말은 연결 없음(null) */
function serviceSourceDateKey(dateKey){
  if(serviceDayType(dateKey)!=='lunchbox') return null;
  return toKey(addDays(new Date(dateKey+'T00:00:00'), -1));
}
function blankServiceMeal(dateKey){
  return {
    serviceDate: dateKey,
    sourceMealDate: serviceSourceDateKey(dateKey),
    type: serviceDayType(dateKey),
    useSourceMeal: true,
    dessertIds: [], snackIds: [],
    memo: '',
    createdAt: null, updatedAt: null,
  };
}
/** 저장된 용역부 식사일 레코드 보정(예전/불완전 데이터도 안전하게 읽히도록) */
function normalizeServiceMeal(raw, dateKey){
  const base = blankServiceMeal(dateKey);
  if(!raw) return base;
  const s = {...base, ...deepClone(raw)};
  s.serviceDate = dateKey;
  s.sourceMealDate = serviceSourceDateKey(dateKey); // 요일 규칙이 항상 우선
  s.type = serviceDayType(dateKey);
  s.dessertIds = Array.isArray(s.dessertIds) ? s.dessertIds.filter(Boolean) : [];
  s.snackIds = Array.isArray(s.snackIds) ? s.snackIds.filter(Boolean) : [];
  s.useSourceMeal = s.useSourceMeal !== false;
  s.memo = s.memo || '';
  return s;
}
function normalizeServiceMenu(raw){
  const s = {...raw};
  s.name = s.name || '';
  s.category = SERVICE_MENU_CATS.includes(s.category) ? s.category : '후식';
  s.description = s.description || '';
  s.qtyPerPerson = Number(s.qtyPerPerson) || 0;
  s.unit = s.unit || '개';
  s.costPerPerson = Number(s.costPerPerson) || 0;
  s.ingId = s.ingId || '';
  s.url = s.url || '';
  s.isActive = (s.isActive===undefined) ? true : !!s.isActive;
  s.createdAt = s.createdAt || null;
  s.updatedAt = s.updatedAt || null;
  return s;
}
function serviceMenuPayload(s){
  return {
    name:s.name, category:s.category, description:s.description,
    qtyPerPerson:s.qtyPerPerson, unit:s.unit, costPerPerson:s.costPerPerson,
    ingId:s.ingId, url:s.url, isActive:s.isActive,
    createdAt:s.createdAt, updatedAt:s.updatedAt,
  };
}
function serviceMenuById(id){ return (S.serviceMenus||[]).find(x=>x.id===id); }
/** 용역부 추가 메뉴의 1인 비용.
 *  실제 구매상품(ingId)에 연결돼 있으면 등록된 구매가 기준으로 자동 계산하고(중복 입력 불필요),
 *  연결이 없으면 사용자가 직접 입력한 1인 비용을 그대로 쓴다. */
function serviceMenuCostPerPerson(sm){
  if(!sm) return 0;
  if(sm.ingId){
    const reg = ingredientById(sm.ingId);
    if(reg && reg.purchaseQty){
      const f = unitConvFactor(sm.unit, reg.baseUnit);
      return ((reg.purchasePrice||0)/reg.purchaseQty) * (f === null ? 1 : f) * (sm.qtyPerPerson||0);
    }
  }
  return sm.costPerPerson || 0;
}
/** 메뉴에 연결된 상품 URL(메뉴에 직접 적은 URL이 우선, 없으면 재료·상품 등록의 URL) */
function serviceMenuUrl(sm){
  if(sm && sm.url) return sm.url;
  const reg = sm && sm.ingId ? ingredientById(sm.ingId) : null;
  return reg && reg.url ? reg.url : '';
}
async function addServiceMenuRec(s){
  const now = new Date().toISOString();
  const rec = normalizeServiceMenu({...s, createdAt: s.createdAt || now, updatedAt: now});
  if(db){ const ref = await db.collection('serviceMenus').add(serviceMenuPayload(rec)); rec.id = ref.id; }
  else { rec.id = 'local_'+Math.random().toString(36).slice(2,9); }
  S.serviceMenus.push(rec);
  return rec;
}
async function updateServiceMenuRec(id, patch){
  const idx = S.serviceMenus.findIndex(x=>x.id===id);
  if(idx<0) return;
  const merged = normalizeServiceMenu({...S.serviceMenus[idx], ...patch, updatedAt:new Date().toISOString()});
  S.serviceMenus[idx] = merged;
  if(db) await db.doc('serviceMenus/'+id).set(serviceMenuPayload(merged));
  return merged;
}
async function deleteServiceMenuRec(id){
  S.serviceMenus = S.serviceMenus.filter(x=>x.id!==id);
  if(db) await db.doc('serviceMenus/'+id).delete();
}
/** 용역부 식사일 저장(날짜 키 = 용역부가 먹는 날) */
async function saveServiceMeal(dateKey, data){
  const now = new Date().toISOString();
  const rec = normalizeServiceMeal({...data, createdAt: (data && data.createdAt) || now, updatedAt: now}, dateKey);
  S.serviceMeals[dateKey] = rec;
  if(db) await db.doc('serviceMeals/'+dateKey).set(rec);
  return rec;
}
/** 해당 주(월~금)의 용역부 식사일 기록을 불러온다. 없는 날은 기본값으로 취급(저장은 하지 않음) */
async function ensureServiceWeekLoaded(monday){
  const dates = weekDates(monday);
  if(db){
    const snaps = await Promise.all(dates.map(d=>db.doc('serviceMeals/'+toKey(d)).get()));
    dates.forEach((d,i)=>{ const k=toKey(d); S.serviceMeals[k] = snaps[i].exists ? normalizeServiceMeal(snaps[i].data(), k) : null; });
  } else {
    dates.forEach(d=>{ const k=toKey(d); if(!(k in S.serviceMeals)) S.serviceMeals[k]=null; });
  }
}
function serviceMealFor(dateKey){ return S.serviceMeals[dateKey] || blankServiceMeal(dateKey); }
/** 연결된 영업부 식단의 1인 식사 원가(배달일이면 배달 단가). 식단이 아직 없으면 0. */
function serviceBaseMealCost(sourceDateKey){
  if(!sourceDateKey) return 0;
  const day = S.mealPlan[sourceDateKey];
  if(!day || !day.lunch) return 0;
  if(day.lunch.type==='delivery') return day.lunch.deliveryCost||0;
  return (day.lunch.slots||[]).reduce((sum,slot)=>{ const m = slot.id ? menuById(slot.id) : null; return sum + (m?menuCost(m):0); },0);
}
/** 용역부 1인 비용 = 기본 식사 + 후식 + 일반 간식 + 포장용기 + 발열팩, 총액 = 1인 비용 × 용역부 인원 */
function serviceDayCost(dateKey){
  const type = serviceDayType(dateKey);
  const hc = serviceHeadcount();
  const empty = {type, hc, base:0, dessert:0, snack:0, pack:0, heat:0, perPerson:0, total:0};
  if(type!=='lunchbox') return empty;
  const rec = serviceMealFor(dateKey);
  const base = rec.useSourceMeal!==false ? serviceBaseMealCost(rec.sourceMealDate) : 0;
  const sumOf = ids => (ids||[]).reduce((s,id)=>{ const sm=serviceMenuById(id); return s + (sm && sm.isActive!==false ? serviceMenuCostPerPerson(sm) : 0); },0);
  const dessert = sumOf(rec.dessertIds);
  const snack = sumOf(rec.snackIds);
  // 그날 도시락에 들어갈 내용이 아직 하나도 없으면(연결된 영업부 식단 미편성 + 추가 메뉴 없음)
  // 포장비도 발생하지 않는 것으로 본다 — 빈 날에 포장비만 잡혀 비용이 부풀지 않도록.
  const hasContent = base>0 || dessert>0 || snack>0;
  const pack = hasContent ? packagingCostPerPerson() : 0;
  const heat = hasContent ? heatingPackCostPerPerson() : 0;
  const perPerson = base + dessert + snack + pack + heat;
  return {type, hc, base, dessert, snack, pack, heat, perPerson, total: perPerson*hc, hasContent};
}
async function addIngredientRec(i){

  else { i.id = 'local_'+Math.random().toString(36).slice(2,9); }

/* ===================== 🗄 재고(향후 확장용 스텁 — 아직 화면 없음) =====================
 * 나중에 "필요 발주수량 = 이번 주 필요량 − 현재 재고"로 자동 차감하는 기능을 붙이기 위해
 * 데이터 형태만 미리 정의해 둔다. 지금은 어디서도 읽거나 쓰지 않으며 계산에도 영향을 주지 않는다.
 * 저장 위치(예정): stock/<ingredientId> = {ingId, qty, unit, updatedAt} */
function buildEmptyStockRecord(ingId){ return {ingId, qty:0, unit:'', updatedAt:null}; }

async function deleteIngredientRec(id){
  const used = S.menus.filter(m=>(m.ingredients||[]).some(ing=>ing.ingId===id));
  if(used.length && !await customConfirm(`이 재료는 ${used.length}개 메뉴(${used.slice(0,3).map(m=>m.name).join(', ')}${used.length>3?' 외':''})에서 사용 중입니다. 삭제하면 해당 메뉴의 재료는 "직접입력" 상태로 남습니다. 계속할까요?`)) return;
  S.ingredients = S.ingredients.filter(x=>x.id!==id);
  if(db) await db.doc('ingredients/'+id).delete();
}

/* ===================== 요일별 원가 계산 ===================== */
function dayCost(dateKey){
  const day = S.mealPlan[dateKey];
  const hc = S.settings.headcount;
  if(!day) return {perPerson:0, total:0};
  let perPerson = 0;
  if(day.lunch.type==='delivery') perPerson += day.lunch.deliveryCost||0;
  else {
    (day.lunch.slots||[]).forEach(slot=>{ if(!slot.id) return; const m=menuById(slot.id); if(m) perPerson += menuCost(m); });
  }
  const snackTotal = (day.snack && day.snack.items || []).reduce((s,it)=>s+(it.qty*it.unitPrice||0),0);
  return {perPerson, total: perPerson*hc + snackTotal, snackTotal};
}

    cost:'기간별 식재료비와 예산 대비 현황을 분석합니다',

function renderTopStats(){
  const el = document.getElementById('topStats');
  const today = new Date();
  const hc = S.settings.headcount;
  const unpaid = S.orders.filter(o=>o.payment && o.payment.status==='미결제').length;
  el.innerHTML = `
    <span class="chip gray">👥 ${hc}인 기준</span>
    <span class="chip ${unpaid>0?'amber':'green'}">미결제 발주 ${unpaid}건</span>
    <span class="chip gray">${today.getFullYear()}.${pad(today.getMonth()+1)}.${pad(today.getDate())}</span>
  `;
}
let renderGen = 0;
async function render(){
  const myGen = ++renderGen;
  renderTopStats();
  const view = document.getElementById('view');
  let html;
  if(activeTab==='dashboard'){ await ensureWeekLoaded(currentWeekMonday); html = await renderDashboard(); }
  else if(activeTab==='plan'){ await ensureMonthLoadedIfNeeded(); html = renderPlan(); }
  else if(activeTab==='menus') html = renderMenus();
  else if(activeTab==='ingredients') html = renderIngredients();
  else if(activeTab==='service'){ await ensureServiceViewLoaded(); html = renderService(); }
  else if(activeTab==='order') html = renderOrder();
  else if(activeTab==='cost'){ await ensureWeekLoaded(costWeekMonday); html = renderCost(); }
  else if(activeTab==='settings') html = renderSettings();
  else if(activeTab==='users'){ await loadUsers(); html = renderUsers(); }
  // 이 render() 호출이 실행되는 동안 더 최신 render()가 이미 시작됐다면
  // (예: 네트워크 지연 중 사용자가 다른 탭을 클릭한 경우) 이 결과는 오래된 것이므로
  // 화면에 반영하지 않는다 - 그렇지 않으면 최신 화면이 옛 화면으로 되돌아가는 버그가 생긴다.
  if(myGen !== renderGen) return;
  view.innerHTML = readOnlyBanner() + html;
  // 화면을 그린 직후, 보기 전용 계정에게 허용되지 않은 조작 요소를 일괄 차단한다.
  applyPermissionGuards();
}
/** 식단표 화면 - 주간 보기면 해당 주만, 월간 보기면 그 달 전체 주를 미리 로드한다. */
async function ensureMonthLoadedIfNeeded(){
  // 주간 보기에는 아래에 용역부 도시락 연결 줄도 함께 표시하므로 용역부 기록도 같이 불러온다.
  if(planView==='week'){ await Promise.all([ensureWeekLoaded(currentWeekMonday), ensureServiceWeekLoaded(currentWeekMonday)]); return; }
  const first = new Date(planMonth.y, planMonth.m, 1);
  const last = new Date(planMonth.y, planMonth.m+1, 0);
  let mon = mondayOf(first);
  const mondays = [];
  while(mon<=last){ mondays.push(new Date(mon)); mon = addDays(mon,7); }
  await Promise.all(mondays.map(m=>ensureWeekLoaded(m)));
}

/* ===================== 대시보드 ===================== */
async function renderDashboard(){
  const dates = weekDates(currentWeekMonday);
  const today = new Date();
  let weekTotal=0, weekPerPersonSum=0, cookDays=0;
  dates.forEach(d=>{ const c = dayCost(toKey(d)); weekTotal+=c.total; if(S.mealPlan[toKey(d)] && S.mealPlan[toKey(d)].lunch.type==='cook'){ weekPerPersonSum+=c.perPerson; cookDays++; } });
  const avgPerPerson = cookDays? weekPerPersonSum/cookDays : (weekPerPersonSum);
  const budget = S.settings.budgetPerPerson;
  const ratio = budget? Math.round((avgPerPerson/budget)*100) : 0;
  const menuCount = S.menus.length;
  const unpaidOrders = S.orders.filter(o=>o.payment && o.payment.status==='미결제');

  // 이번 주 발주 현황: 이미 발주가 확정돼 있으면 그 기록으로, 아직이면 필요 품목만 읽기전용으로 미리 계산
  const weekKey = toKey(currentWeekMonday);
  const weekOrders = S.orders.filter(o=>o.startDate===weekKey);
  const hasOrder = weekOrders.length>0;
  let orderAmount=0, doneCount=0, totalItemCount=0;
  if(hasOrder){
    weekOrders.forEach(o=>{ orderAmount+=o.totalCost||0; const items=o.items||[]; totalItemCount+=items.length; doneCount+=items.filter(orderItemDone).length; });
  } else {
    const agg = await buildOrderAggregation(currentWeekMonday, {includeSnack:true});
    totalItemCount = agg.items.length;
  }
  const doneRatio = totalItemCount? Math.round(doneCount/totalItemCount*100) : 0;

  const dayRows = dates.map((d,i)=>{
    const key = toKey(d);
    const day = S.mealPlan[key];
    const isToday = sameDate(d, today);
    if(!day) return `<div class="daycard${isToday?' today':''}"><div class="dhead"><span class="d">${WD_LABEL[i]} · ${fmtMD(d)}</span></div><div class="muted" style="font-size:12px;">식단 없음</div></div>`;
    const c = dayCost(key);
    const body = day.lunch.type==='delivery'
      ? `<div class="chip amber">🚚 ${esc(day.lunch.theme)}</div><div class="muted" style="font-size:11.5px;">${esc(day.lunch.memo||'외부 배달')}</div>`
      : (day.lunch.slots||[]).filter(slot=>slot.id).map(slot=>{ const m=menuById(slot.id); return `<div style="font-size:12px;"><span class="muted">${slot.cat}</span> ${esc(m?m.name:'-')}</div>`; }).join('') || `<div class="muted" style="font-size:11.5px;">아직 선택된 메뉴 없음</div>`;
    return `<div class="daycard${isToday?' today':''}">

      ${body}
      <div class="daycost"><span class="muted">1인 ${fmtWon(c.perPerson)}</span><b class="num">${fmtWon(c.total)}</b></div>

    <div class="card stat-tile"><span class="label">조리일 1인 평균 단가</span><span class="value num">${fmtWon(avgPerPerson)}</span><span class="sub">목표 ${fmtWon(budget)} 대비 <b class="${ratio>100?'':''}">${ratio}%</b></span></div>

/* ===================== 식단표 ===================== */
function shiftWeek(dir){ currentWeekMonday = addDays(currentWeekMonday, dir*7); render(); }
function gotoThisWeek(){ currentWeekMonday = mondayOf(new Date()); planView='week'; render(); }
function setPlanCat(c){ planCat=c; render(); }
function setPlanView(v){ planView=v; render(); }
function shiftPlanMonth(dir){
  let m = planMonth.m+dir, y = planMonth.y;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  planMonth = {y,m}; render();
}
function jumpToWeekFromMonth(dateKey){ currentWeekMonday = mondayOf(new Date(dateKey)); planView='week'; render(); }

/* ===================== 식단 금액 요약 · 인쇄용 표 ===================== */
/** 여러 날짜의 1인 단가·총액을 한 번에 더한다(식단이 편성된 날만 셈). */
function planCostSummary(dateList){
  let perPersonSum = 0, totalSum = 0, days = 0;
  dateList.forEach(d=>{
    const k = (typeof d === 'string') ? d : toKey(d);
    const day = S.mealPlan[k];
    if(!day) return;
    const c = dayCost(k);
    if(c.perPerson > 0 || c.total > 0) days++;
    perPersonSum += c.perPerson;
    totalSum += c.total;
  });
  return {perPersonSum, totalSum, days, avgPerPerson: days ? perPersonSum/days : 0};
}
/** 금액 요약 카드(화면 전용 — 인쇄물에는 나가지 않는다). */
function planCostSummaryCard(label, sum){
  const budget = Number(S.settings.budgetPerPerson) || 0;
  const diff = budget ? sum.avgPerPerson - budget : 0;
  const over = diff > 0;
  const pct = budget ? Math.round((sum.avgPerPerson / budget) * 100) : 0;
  return `<div class="card tight screenonly printhide" style="margin-bottom:14px;">
    <div class="flex-between" style="flex-wrap:wrap;gap:10px;">
      <div class="section-title" style="margin-bottom:0;">${esc(label)} 금액 <span class="chip gray">${sum.days}일</span></div>
      <div class="chip-row" style="gap:8px;flex-wrap:wrap;">
        <span class="chip gray">1인 합계 <b class="num">${fmtWon(sum.perPersonSum)}</b></span>
        <span class="chip gray">1일 평균 1인 <b class="num">${fmtWon(sum.avgPerPerson)}</b></span>
        <span class="chip ${over?'red':'green'}">총액 <b class="num">${fmtWon(sum.totalSum)}</b></span>
        ${budget && canSeeMoney() ? `<span class="chip ${over?'red':'green'}">목표 ${fmtWon(budget)} 대비 ${pct}% (${over?'+':''}${fmtWon(diff)})</span>` : ''}
      </div>
    </div>
    <div class="muted" style="font-size:11.5px;margin-top:8px;">
      총액은 1인 단가 × ${S.settings.headcount}인으로 계산하며, 그날 간식표 금액이 있으면 함께 더합니다. 인쇄물에는 금액이 나오지 않습니다.
    </div>
  </div>`;
}
function catLabel(cat){ return (CATS[cat] && CATS[cat].label) || cat; }
/** 인쇄용 분류 색. 분류 목록에서의 자리(밥·국·메인·반찬·면·간식·사용자추가…)에 따라 8색을 돌려
 *  쓰므로, 인접한 줄끼리 절대 같은 색이 되지 않고 주마다 같은 분류는 늘 같은 색으로 나온다. */
const PRINT_CAT_CLASSES = ['pk0','pk1','pk2','pk3','pk4','pk5','pk6','pk7'];
function catColor(cat){
  const keys = Object.keys(CATS);
  let i = keys.indexOf(cat);
  if(i < 0){ // 목록에 없는(삭제된) 분류 — 이름으로 고정 색을 정한다
    let h = 0; for(let k=0;k<String(cat).length;k++) h = (h*31 + String(cat).charCodeAt(k)) % 997;
    i = h;
  }
  return PRINT_CAT_CLASSES[i % PRINT_CAT_CLASSES.length];
}
/** 범례·막대에 쓰는 대표색 */
const PRINT_CAT_SWATCH = {pk0:'#e2e2dc', pk1:'#cfe6e4', pk2:'#d5ead8', pk3:'#ecdfc4', pk4:'#f7ddc2', pk5:'#f0e9b8', pk6:'#ddd8ef', pk7:'#f2d5dc'};
/** 그 주에 실제로 쓰인 분류만, 기본 순서(밥·국·메인·반찬…)대로 추린다. */
function planPrintCategories(dateList){
  const present = [];
  dateList.forEach(d=>{
    const day = S.mealPlan[toKey(d)];
    if(!day || day.lunch.type !== 'cook') return;
    (day.lunch.slots||[]).forEach(sl=>{ if(sl.id && !present.includes(sl.cat)) present.push(sl.cat); });
  });
  const ordered = Object.keys(CATS).filter(c=>present.includes(c));
  present.forEach(c=>{ if(!ordered.includes(c)) ordered.push(c); });
  return ordered;
}
function printLegend(cats){
  if(!cats.length) return '';
  const seen = {};
  const items = cats.map(c=>{
    if(seen[c]) return '';
    seen[c] = 1;
    const bg = PRINT_CAT_SWATCH[catColor(c)] || '#e2e2dc';
    return `<span><i style="background:${bg}"></i>${esc(catLabel(c))}</span>`;
  }).join('');
  return `<div class="print-legend">${items}</div>`;
}
/** 인쇄용 주간 식단표 — 분류를 행으로 묶고 색을 달리해 한눈에 들어오게 만든다. 금액 없음. */
function renderPlanPrintWeek(dates){
  const cats = planPrintCategories(dates);
  const deliveryShown = {};
  const head = dates.map((d,i)=>{
    const day = S.mealPlan[toKey(d)];
    const theme = day ? day.lunch.theme : '';
    return `<th><div class="ps-day">${WD_LABEL[i]}요일</div><div class="ps-date">${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}</div>${theme?`<div class="ps-theme">${esc(theme)}</div>`:''}</th>`;
  }).join('');
  const rows = cats.map((cat, rowIdx)=>{
    const cells = dates.map((d,ci)=>{
      const day = S.mealPlan[toKey(d)];
      if(!day) return `<td><span class="ps-empty">—</span></td>`;
      if(day.lunch.type === 'delivery'){
        if(deliveryShown[ci]) return `<td></td>`;
        deliveryShown[ci] = true;
        return `<td class="ps-delivery">🚚 ${esc(day.lunch.theme)}<div class="ps-memo" style="text-align:center;">${esc(day.lunch.memo||'배달')}</div></td>`;
      }
      const names = (day.lunch.slots||[]).filter(sl=>sl.cat===cat && sl.id)
        .map(sl=>{ const m = menuById(sl.id); return m ? esc(m.name) : ''; }).filter(Boolean);
      return `<td>${names.length ? names.map(n=>`<div class="ps-item">${n}</div>`).join('') : '<span class="ps-empty">—</span>'}</td>`;
    }).join('');
    return `<tr class="${catColor(cat)}"><th class="ps-cat">${esc(catLabel(cat))}</th>${cells}</tr>`;
  }).join('');
  const hasMemo = dates.some(d=>{ const day = S.mealPlan[toKey(d)]; return day && day.lunch.type==='cook' && (day.lunch.memo||'').trim(); });
  const memoRow = hasMemo ? `<tr class="ps-memorow"><th class="ps-cat">메모</th>${
    dates.map(d=>{ const day = S.mealPlan[toKey(d)]; return `<td class="ps-memo">${esc((day && day.lunch.type==='cook' && day.lunch.memo)||'')}</td>`; }).join('')
  }</tr>` : '';
  const body = cats.length ? rows + memoRow
    : `<tr><td colspan="6" style="padding:26px;color:#a9a9a2;">편성된 식단이 없습니다.</td></tr>`;
  return `<div class="printonly">
    <h2 class="print-title">영업부 주간 식단표</h2>
    <div class="print-sub">${fmtMD(dates[0])} ~ ${fmtMD(dates[4])} · Unbelievable Company</div>
    <table class="printsheet">
      <thead><tr><th class="ps-cat">구분</th>${head}</tr></thead>
      <tbody>${body}</tbody>
    </table>
    ${printLegend(cats)}
  </div>`;
}
/** 인쇄용 월간 식단표 — 달력 칸마다 분류별 색 막대로 구분. 금액 없음. */
function renderPlanPrintMonth(weekMondays){
  const rows = weekMondays.map(wk=>{
    const wdates = weekDates(wk);
    const cells = wdates.map(d=>{
      const inMonth = d.getMonth() === planMonth.m;
      const day = S.mealPlan[toKey(d)];
      let body = '<span class="ps-empty" style="font-size:11px;">—</span>';
      if(day && day.lunch.type === 'delivery'){
        body = `<div class="pm-item pk4">🚚 ${esc(day.lunch.theme)}</div>`;
      } else if(day){
        const items = (day.lunch.slots||[]).filter(sl=>sl.id).map(sl=>{
          const m = menuById(sl.id);
          return m ? `<div class="pm-item ${catColor(sl.cat)}">${esc(m.name)}</div>` : '';
        }).filter(Boolean).join('');
        if(items) body = items;
      }
      return `<td class="${inMonth?'':'pm-out'}"><div class="pm-date">${fmtMD(d)}</div>${inMonth?body:''}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  const allCats = [];
  weekMondays.forEach(wk=>planPrintCategories(weekDates(wk)).forEach(c=>{ if(!allCats.includes(c)) allCats.push(c); }));
  return `<div class="printonly">
    <h2 class="print-title">영업부 월간 식단표</h2>
    <div class="print-sub">${planMonth.y}년 ${planMonth.m+1}월 · Unbelievable Company</div>
    <table class="pmonth">
      <thead><tr>${WD_LABEL.map(w=>`<th>${w}요일</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${printLegend(allCats)}
  </div>`;
}

function renderPlan(){
  planCat = 'lunch';   // 간식표는 '용역부 간식표' 탭으로 옮겼다(같은 데이터를 두 곳에서 고치지 않도록)
  const dates = weekDates(currentWeekMonday);
  const today = new Date();
  const nav = planView==='week' ? `
      <div class="weeknav">

    ${planCat==='lunch' && planView==='week' ? `

        <input type="number" id="budgetFitInput" value="${S.settings.budgetPerPerson}" onchange="updateBudget(this.value)">
      </label>
      <button id="budgetFitBtn" class="btn primary" onclick="budgetFitWeek()" ${budgetFitting?'disabled':''}>${budgetFitting?'⏳ 계산 중…':'💡 예산에 맞는 메뉴로 추천'}</button>
      <span class="muted" style="font-size:11.8px;">입력한 단가 안에서 등록된 메뉴 중 가장 좋은(비싼) 재료 조합을 요일별로 골라줍니다. 메뉴 관리에서 메뉴를 더 등록할수록 추천 폭이 넓어집니다.</span>
    </div>` : ''}`;

  if(planView==='month'){

    const summary = planCat==='lunch' ? planCostSummaryCard(planMonth.y+'년 '+(planMonth.m+1)+'월', planCostSummary(monthDates)) : '';
    return header + summary + renderPlanMonth();

  if(planCat==='snack') return header + renderSnackTable(dates);

  const cards = dates.map((d,i)=>{

    const day = S.mealPlan[key] || defaultDay(i,key);

    const c = dayCost(key);
    let body;
    if(day.lunch.type==='delivery'){
      body = `<div class="delivery-box">
        <div class="flex-between"><span class="chip amber">🚚 ${esc(day.lunch.theme)}</span><span class="num" style="font-weight:700;">${fmtWon(day.lunch.deliveryCost)}/인</span></div>
        <input class="memo-input" value="${esc(day.lunch.memo||'')}" placeholder="배달 업체 / 메모" onchange="updateDeliveryMemo('${key}',this.value)">
        <label class="field" style="font-size:11px;">단가(원/인)
          <input type="number" value="${day.lunch.deliveryCost||0}" onchange="updateDeliveryCost('${key}',this.value)">

        return `<div class="slot-row" style="flex-direction:row;align-items:center;gap:5px;">

          </select>
          <button class="iconbtn" style="flex:none;width:24px;height:24px;" onclick="removeSlotRow('${key}',${idx})">✕</button>

    </div>`;

  return header + planCostSummaryCard('이번 주(' + fmtMD(dates[0]) + '~' + fmtMD(dates[4]) + ')', planCostSummary(dates))
  + renderPlanPrintWeek(dates)
  + `<div class="daygrid screenonly">${cards}</div>
  <div class="screenonly">${renderServiceStrip(dates)}</div>
  <p class="muted screenonly" style="margin-top:14px;font-size:12px;">※ 각 카드의 "+ 항목 추가"로 메인·반찬 등을 원하는 개수만큼 자유롭게 넣고, 각 줄의 분류를 바꿔가며 구성할 수 있습니다. 요일 테마를 바꾸면 다음에 새로 추가하는 항목의 선택 폭이 그 테마에 맞춰집니다. 배달일로 바꾸면 슬롯 대신 배달 단가를 입력합니다.</p>`;
}
/** 식단표(영업부) 주간 보기 아래에 붙는 용역부 연결 줄 — 어느 날 식단이 용역부 며칠 도시락으로

/** 월간 보기: 식단표/간식표 각각 별도 데이터로 그 달 전체를 요약 표시(읽기 전용 요약 + 인쇄용). 칸 클릭 시 해당 주간 편집 화면으로 이동. */
/** 그 달 달력에 실제로 그려지는 날짜(월~금) 전체 */
function planMonthWeekMondays(){
  const first = new Date(planMonth.y, planMonth.m, 1);
  const last = new Date(planMonth.y, planMonth.m+1, 0);
  let mon = mondayOf(first);
  const weeks = [];
  while(mon<=last){ weeks.push(new Date(mon)); mon = addDays(mon,7); }
  return weeks;
}

function defaultSlots(theme){ return slotsForTheme(theme).map(cat=>({cat, id:''})); }
function defaultDay(weekday,key){
  const dt = S.settings.dayThemes[weekday];
  return dt.type==='delivery'
    ? {date:key, weekday, lunch:{type:'delivery',theme:dt.theme,deliveryCost:dt.deliveryCost,memo:''}, snack:{items:[]}}
    : {date:key, weekday, lunch:{type:'cook',theme:dt.theme,slots:defaultSlots(dt.theme),memo:''}, snack:{items:[]}};
}
/** 예전 저장 형식({카테고리:menuId})을 배열 형식([{cat,id}])으로 변환.
 *  db 스냅샷은 읽기전용(frozen)이므로 먼저 깊은 복사본을 만든 뒤 그 복사본을 고친다. */
function normalizeDay(rawDay){
  if(!rawDay) return rawDay;
  const day = deepClone(rawDay);
  if(day && day.lunch && day.lunch.type==='cook' && day.lunch.slots && !Array.isArray(day.lunch.slots)){
    day.lunch.slots = Object.entries(day.lunch.slots).filter(([,id])=>id).map(([cat,id])=>({cat,id}));
  }
  if(day && day.lunch && day.lunch.type==='cook' && !day.lunch.slots){
    day.lunch.slots = [];
  }
  return day;
}

/** 랜덤 식단 생성에서 세트가 뽑힐 확률(세트 후보가 있는 날 기준). 나머지 확률은 기존처럼
 *  슬롯마다 개별 메뉴를 뽑는다 — 세트만 계속 나오면 식단 다양성이 떨어지기 때문. */
const SET_PICK_CHANCE = 0.6;
/** 세트메뉴(예: "제육 반찬세트") 중, 오늘(day)에 배정 가능한 세트만 골라낸다.
 *  - "랜덤 생성에 사용"이 OFF이거나 비활성 세트는 제외(목록에는 남아있지만 랜덤에는 쓰지 않음).
 *  - 구성 메뉴가 2개 미만이거나, 포함된 메뉴가 하나라도 삭제되어 없으면 제외.
 *  - 구성 메뉴 전부의 테마가 오늘 테마(또는 '전체')와 맞아야 후보가 됨 → 요일별 규칙(고기데이·면데이 등) 유지.
 *  - 이미 오늘 배정된 메뉴를 포함한 세트도 제외(같은 메뉴가 두 번 들어가지 않도록).
 *  (분류·슬롯 수는 실제 배정 시점에 처리하며, 칸이 부족하면 자동으로 늘려 배정한다) */
function eligibleMenuSetsForDay(day, usedToday){
  return (S.menuSets||[]).filter(set=>{
    if(set.isActive===false || set.randomEnabled===false) return false;
    const ids = menuSetMenuIds(set);
    if(ids.length<2) return false;
    const members = ids.map(menuById);
    if(members.some(m=>!m)) return false; // 세트 안에 삭제된 메뉴가 있으면 제외
    if(usedToday && ids.some(id=>usedToday.has(id))) return false;
    return members.every(m=> m.theme===day.lunch.theme || m.theme==='전체');
  });
}
/** 선택된 세트의 구성 메뉴들을 오늘 슬롯에 통째로 배정한다.
 *  각 멤버는 자신의 분류(category)와 같은 슬롯을 찾아 채우고, 그런 슬롯이 없거나 이미
 *  이번 세트 배정으로 다 채워졌으면 새 슬롯을 만들어서라도 채운다(기존 "+ 항목 추가"와 동일한 방식).
 *  식단표에는 세트 이름이 아니라 구성 메뉴가 각각 들어가므로, 이후 재료·발주·원가 계산은
 *  기존 메뉴 단위 로직이 그대로 처리한다(세트 전용 계산 경로를 따로 만들지 않는다).
 *  handledSlots에 채운 슬롯을 기록해, 이후 일반 랜덤 배정 루프가 이 슬롯을 다시 건드리지 않게 한다. */
function applyMenuSetToDay(day, set, ctx){
  const handledSlots = ctx.handledSlots;
  menuSetMenuIds(set).forEach(id=>{
    const m = menuById(id);
    if(!m) return;
    let slot = day.lunch.slots.find(s=>s.cat===m.category && !handledSlots.has(s));
    if(!slot){ slot = {cat:m.category, id:''}; day.lunch.slots.push(slot); }
    slot.id = m.id;
    handledSlots.add(slot);
    ctx.usedToday.add(m.id);
    ctx.usedThisWeek.add(m.id);
    m.lastUsedAt = Date.now();
    ctx.touchedMenuIds.add(m.id);
  });
}
/** 요일의 현재 슬롯 구성(개수·분류)은 그대로 두고, 각 슬롯에 들어갈 메뉴만 다시 고른다.
 *  슬롯이 아직 없는 날은 요일 테마의 기본 구성(밥·국·메인·반찬)으로 먼저 채운다.
 *  - 같은 날 안에서는 절대 같은 메뉴가 중복 배정되지 않는다(하드 제약).
 *  - 같은 주 안에서는 가능하면 겹치지 않게 하되(소프트 선호), 메뉴 수가 부족하면 다른 날과는 겹칠 수 있다.
 *  - 메뉴 관리 탭에서 등록한 세트메뉴("랜덤 생성에 사용" ON)가 있으면, 그날 테마에 맞는 세트 하나를
 *    먼저 통째로 배정하고(이번 주에 아직 안 쓴 세트를 우선), 나머지 슬롯만 기존 방식대로 개별 메뉴로
 *    채운다. 세트에 들어간 메뉴는 usedToday에 등록되므로 개별 배정에서 다시 뽑히지 않는다(중복 방지).
 *  - 계산(메뉴 뽑기)은 전부 메모리에서 동기로 끝내고, DB 저장만 마지막에 한 번에 병렬로 실행해 속도를 높인다.
 *  - lastUsedAt이 실제로 바뀐 메뉴만 DB에 다시 쓴다(등록된 메뉴 전체를 매번 쓰지 않음). */
let randomizing = false;
/** 버튼을 누른 즉시(네트워크 지연과 무관하게) "생성 중" 표시가 보이도록 DOM을 직접 먼저 바꿔둔다.
 *  전체 render()는 네트워크 응답을 기다리는 첫 await까지 그림을 갱신하지 않으므로, 클릭 반응성을 위해 필요하다. */
function setRandomizeBtnLoading(loading, label){
  const btn = document.getElementById('randomizeBtn');
  if(btn){ btn.disabled = loading; btn.textContent = loading ? '⏳ '+label : '🔀 랜덤 식단 생성'; }
}
async function randomizeWeek(){
  if(randomizing) return;
  randomizing = true; setRandomizeBtnLoading(true, '생성 중…');
  try{
    const dates = weekDates(currentWeekMonday);
    const usedThisWeek = new Set();
    const touchedMenuIds = new Set();
    const pendingDays = [];
    for(let i=0;i<dates.length;i++){
      const key = toKey(dates[i]);
      let day = S.mealPlan[key] || defaultDay(i,key);
      if(day.lunch.type==='delivery'){ S.mealPlan[key]=day; continue; }
      if(!day.lunch.slots || !day.lunch.slots.length) day.lunch.slots = defaultSlots(day.lunch.theme);
      const usedToday = new Set();
      const handledSlots = new Set(); // 세트메뉴로 이미 채운 슬롯(아래 개별 랜덤 배정에서 건드리지 않음)

      // --- 세트메뉴를 하나의 "선택 단위"로 먼저 배정(랜덤 사용 ON인 세트가 있을 때만) ---
      const eligibleSets = eligibleMenuSetsForDay(day, usedToday);
      if(eligibleSets.length && Math.random() < SET_PICK_CHANCE){
        // 이번 주에 아직 안 쓴 세트를 우선(없으면 전체 후보에서)
        const freshSets = eligibleSets.filter(set=>!menuSetMenuIds(set).some(id=>usedThisWeek.has(id)));
        const setPool = freshSets.length ? freshSets : eligibleSets;
        const chosenSet = setPool[Math.floor(Math.random()*setPool.length)];
        applyMenuSetToDay(day, chosenSet, {usedToday, usedThisWeek, touchedMenuIds, handledSlots});
      }

      day.lunch.slots.forEach(slot=>{
        if(handledSlots.has(slot)) return; // 세트메뉴로 이미 채워진 슬롯은 건드리지 않음
        const byCatTheme = S.menus.filter(m=>m.category===slot.cat && (m.theme===day.lunch.theme || m.theme==='전체'));
        // 당일 중복 금지: 오늘 이미 배정된 메뉴는 무조건 제외(하드 제약)
        const notUsedToday = byCatTheme.filter(m=>!usedToday.has(m.id));
        if(!notUsedToday.length) return; // 그 분류에 오늘 더 쓸 수 있는 메뉴가 없음 -> 슬롯 비워둠
        // 그 중 이번 주에 아직 안 쓴 것을 우선(소프트 선호)
        const freshThisWeek = notUsedToday.filter(m=>!usedThisWeek.has(m.id));
        let candidates = freshThisWeek.length ? freshThisWeek : notUsedToday;
        candidates = candidates.slice().sort((a,b)=>(a.lastUsedAt||0)-(b.lastUsedAt||0));
        const poolSize = Math.max(1, Math.ceil(candidates.length/2));
        const pool = candidates.slice(0, poolSize);
        const pick = pool[Math.floor(Math.random()*pool.length)];
        slot.id = pick.id;
        usedToday.add(pick.id);
        usedThisWeek.add(pick.id);
        pick.lastUsedAt = Date.now();
        touchedMenuIds.add(pick.id);
      });
      S.mealPlan[key] = day;
      pendingDays.push({key, day});
    }
    await Promise.all([
      ...pendingDays.map(({key,day})=>saveMealPlanDay(key,day)),
      ...(db ? [...touchedMenuIds].map(id=>db.doc('menus/'+id).set(menuById(id))) : []),
    ]);
  } finally {
    randomizing = false;
    render();
  }
}

/** 슬롯별 후보 목록(위치별 menu[] 배열)의 모든 조합을 생성. 후보가 많아지는 상황을 대비해 조합 수를 제한. */
function cartesianCombos(candLists){
  let combos = [[]];
  for(const cands of candLists){
    const next = [];
    for(const combo of combos){
      for(const cand of cands){
        next.push([...combo, cand]);
        if(next.length>=3000) break;
      }
      if(next.length>=3000) break;
    }
    combos = next;
  }
  return combos;
}

/** 목표 1인 단가 안에서 요일별로 "예산을 최대한 채우는(=가장 좋은 재료를 쓰는)" 조합을 고른다.
 *  각 날의 현재 슬롯 구성(개수·분류)은 그대로 두고 메뉴만 다시 고른다.
 *  - 같은 날 안에서는 가능하면 같은 메뉴가 중복 배정되지 않는 조합을 우선 채택하고(소프트),
 *    그런 조합이 하나도 없을 때만(그 분류 메뉴 자체가 부족할 때) 중복을 허용한다.
 *  - 같은 주 안에서는 가능하면 겹치지 않게 하여 다양성을 확보한다.
 *  - DB 저장은 마지막에 한 번에 병렬로 처리하고, 실제로 lastUsedAt이 바뀐 메뉴만 다시 쓴다. */
let budgetFitting = false;
function setBudgetFitBtnLoading(loading){
  const btn = document.getElementById('budgetFitBtn');
  if(btn){ btn.disabled = loading; btn.textContent = loading ? '⏳ 계산 중…' : '💡 예산에 맞는 메뉴로 추천'; }
}
async function budgetFitWeek(){
  if(budgetFitting) return;
  const target = S.settings.budgetPerPerson;
  if(!target){ await customAlert('먼저 목표 1인 단가를 입력해주세요.'); return; }
  budgetFitting = true; setBudgetFitBtnLoading(true);
  try{
    const dates = weekDates(currentWeekMonday);
    const usedThisWeek = new Set();
    const touchedMenuIds = new Set();
    const pendingDays = [];
    const summary = [];
    for(let i=0;i<dates.length;i++){
      const key = toKey(dates[i]);
      let day = S.mealPlan[key] || defaultDay(i,key);
      if(day.lunch.type==='delivery'){ S.mealPlan[key]=day; summary.push(`${WD_LABEL[i]} 배달`); continue; }
      if(!day.lunch.slots || !day.lunch.slots.length) day.lunch.slots = defaultSlots(day.lunch.theme);
      const candLists = day.lunch.slots.map(slot=>{
        let cands = S.menus.filter(m=>m.category===slot.cat && (m.theme===day.lunch.theme || m.theme==='전체'));
        if(!cands.length) return [null];
        const fresh = cands.filter(m=>!usedThisWeek.has(m.id));
        return fresh.length ? fresh : cands;
      });
      const combos = cartesianCombos(candLists);
      // 같은 날 안에서 메뉴가 중복되지 않는 조합만 우선 고려(하드 선호) — 다 걸러지면(메뉴 부족) 전체 조합으로 되돌아간다.
      const dedupCombos = combos.filter(combo=>{
        const ids = combo.filter(Boolean).map(m=>m.id);
        return new Set(ids).size === ids.length;
      });
      const pool = dedupCombos.length ? dedupCombos : combos;
      let best=null, bestCost=-Infinity, cheapest=null, cheapestCost=Infinity;
      pool.forEach(combo=>{
        const cost = combo.reduce((s,m)=>s+(m?menuCost(m):0),0);
        if(cost<=target && cost>bestCost){ best=combo; bestCost=cost; }
        if(cost<cheapestCost){ cheapest=combo; cheapestCost=cost; }
      });
      const chosen = best || cheapest;
      const chosenCost = best ? bestCost : cheapestCost;
      day.lunch.slots.forEach((slot,idx)=>{
        const m = chosen[idx];
        slot.id = m ? m.id : '';
        if(m){ usedThisWeek.add(m.id); m.lastUsedAt = Date.now(); touchedMenuIds.add(m.id); }
      });
      S.mealPlan[key] = day;
      pendingDays.push({key, day});
      summary.push(`${WD_LABEL[i]} ${Math.round(chosenCost).toLocaleString()}원${chosenCost>target?' (예산 초과)':''}${!dedupCombos.length && combos.length ? ' (메뉴 부족으로 일부 중복 가능)':''}`);
    }
    await Promise.all([
      ...pendingDays.map(({key,day})=>saveMealPlanDay(key,day)),
      ...(db ? [...touchedMenuIds].map(id=>db.doc('menus/'+id).set(menuById(id))) : []),
    ]);
    await customAlert(`목표 1인 단가 ${target.toLocaleString()}원 기준으로 추천했습니다.\n\n`+summary.join('\n'));
  } finally {
    budgetFitting = false;
    render();
  }
}
