/** 메뉴 삭제. 이 메뉴를 쓰는 세트메뉴가 있으면 먼저 알려주고, 세트와의 관계가 깨지지 않도록
 *  "세트에서 빼고 삭제" 또는 "세트 먼저 수정" 중에서 사용자가 고르게 한다. */
async function removeMenu(id){
  const m = menuById(id);
  const usingSets = (S.menuSets||[]).filter(s=>menuSetMenuIds(s).includes(id));
  if(usingSets.length){
    const names = usingSets.map(s=>'· '+s.name).join('\n');
    const choice = await showModal(
      `"${m?m.name:''}" 메뉴는 현재 ${usingSets.length}개의 세트메뉴에서 사용 중입니다.\n\n${names}\n\n어떻게 할까요?`,
      [
        {label:'취소', value:'cancel'},
        {label:'세트 먼저 수정', value:'edit'},
        {label:'세트에서 빼고 삭제', value:'detach', primary:true},
      ]
    );
    if(choice!=='detach'){
      if(choice==='edit') editMenuSetDraft(usingSets[0].id);
      return;
    }
    // 각 세트에서 이 메뉴만 빼낸다(다른 구성 메뉴와 세트 자체는 그대로 유지).
    for(const s of usingSets){
      const items = (s.items||[]).filter(it=>it.menuId!==id);
      await updateMenuSetRec(s.id, {items});
    }
    const shrunk = usingSets.filter(s=>{ const cur = menuSetById(s.id); return cur && menuSetMenuIds(cur).length<2; });
    await deleteMenuRec(id);
    if(shrunk.length){
      await customAlert(`메뉴를 삭제하고 ${usingSets.length}개 세트에서 제외했습니다.\n\n구성 메뉴가 2개 미만이 된 세트 ${shrunk.length}개는 목록에 남아 있지만 랜덤 식단 생성에서는 사용되지 않습니다. 메뉴를 더 추가해주세요.`);
    }
    render();
    return;
  }
  if(!await customConfirm('이 메뉴를 삭제할까요? 식단표에 사용 중이어도 삭제됩니다.')) return;
  await deleteMenuRec(id); render();
}

  if(val === '__add_ing_cat__'){
    const name = await addCustomIngCategoryFlow();
    if(name) ingFilter.cat = name;
    render();
    return;
  }
  setIngFilter('cat', val);
}
/** 설정 탭에서 직접 추가/삭제할 때 쓰는 버전 */
async function addCustomIngCategoryFromSettings(){ await addCustomIngCategoryFlow(); render(); }
async function removeCustomIngCategory(name){
  const used = S.ingredients.filter(i=>i.category===name).length;
  const extra = used ? `\n\n이 분류로 등록된 재료·상품 ${used}건은 분류값이 그대로 남고, 새로 고를 때만 목록에서 빠집니다.` : '';
  if(!await customConfirm(`"${name}" 재료 분류를 삭제할까요?${extra}`)) return;
  await saveSettings({customIngCategories: (S.settings.customIngCategories||[]).filter(n=>n!==name)});
  render();
}

/* ===================== 🍱 용역부 식단 화면 =====================
 * 영업부 식단을 하루 뒤에 이어받는 구조를 그대로 보여준다.
 *   용역부 월 = 사먹는 날 / 화 ← 영업부 월 / 수 ← 화 / 목 ← 수 / 금 ← 목 (영업부 금요일은 연결 없음)
 * 기본 식사는 연결된 영업부 식단을 그대로 표시하고(메뉴를 새로 만들지 않음),
 * 용역부에게만 추가되는 후식·간식만 이 화면에서 선택한다. */
function shiftServiceWeek(dir){ serviceWeekMonday = addDays(serviceWeekMonday, dir*7); render(); }
function gotoServiceThisWeek(){ serviceWeekMonday = mondayOf(new Date()); serviceView='week'; render(); }
function setServiceView(v){ serviceView = v; render(); }
function setServiceCat(c){ serviceCat = c; render(); }
function shiftServiceMonth(dir){
  let m = serviceMonth.m+dir, y = serviceMonth.y;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  serviceMonth = {y,m}; render();
}
function jumpToServiceWeekFromMonth(dateKey){ serviceWeekMonday = mondayOf(new Date(dateKey+'T00:00:00')); serviceView='week'; render(); }
/** 용역부 화면에 필요한 데이터 로드 — 용역부 기록 + 연결된 영업부 식단(같은 주에 들어있음) */
async function ensureServiceViewLoaded(){
  if(serviceView==='week'){
    await Promise.all([ensureWeekLoaded(serviceWeekMonday), ensureServiceWeekLoaded(serviceWeekMonday)]);
    return;
  }
  const first = new Date(serviceMonth.y, serviceMonth.m, 1);
  const last = new Date(serviceMonth.y, serviceMonth.m+1, 0);
  let mon = mondayOf(first);
  const mondays = [];
  while(mon<=last){ mondays.push(new Date(mon)); mon = addDays(mon,7); }
  await Promise.all(mondays.flatMap(m=>[ensureWeekLoaded(m), ensureServiceWeekLoaded(m)]));
}
async function toggleServiceUseSource(dateKey, val){
  const rec = serviceMealFor(dateKey);
  await saveServiceMeal(dateKey, {...rec, useSourceMeal: !!val});
  orderDraft = null; render();
}
async function addServiceMenuToDay(dateKey, cat, menuId){
  if(!menuId) return;
  const rec = serviceMealFor(dateKey);
  const field = cat==='간식' ? 'snackIds' : 'dessertIds';
  const list = (rec[field]||[]).slice();
  if(list.includes(menuId)){ render(); return; }
  list.push(menuId);
  await saveServiceMeal(dateKey, {...rec, [field]: list});
  orderDraft = null; render();
}
async function removeServiceMenuFromDay(dateKey, cat, menuId){
  const rec = serviceMealFor(dateKey);
  const field = cat==='간식' ? 'snackIds' : 'dessertIds';
  await saveServiceMeal(dateKey, {...rec, [field]: (rec[field]||[]).filter(x=>x!==menuId)});
  orderDraft = null; render();
}
async function updateServiceMemo(dateKey, val){
  const rec = serviceMealFor(dateKey);
  await saveServiceMeal(dateKey, {...rec, memo: val});
}
/** 한 주 전체를 같은 추가 메뉴 구성으로 맞추고 싶을 때(화~금 도시락 날에만 적용) */
async function applyServiceDayToWeek(dateKey){
  const src = serviceMealFor(dateKey);
  if(!await customConfirm('이 날의 후식·간식 구성을 이번 주 다른 도시락 날(화~금)에도 똑같이 적용할까요?\n\n기본 식사는 각 날짜에 연결된 영업부 식단이 그대로 유지됩니다.')) return;
  const dates = weekDates(serviceWeekMonday).map(toKey).filter(k=>serviceDayType(k)==='lunchbox' && k!==dateKey);
  for(const k of dates){
    const rec = serviceMealFor(k);
    await saveServiceMeal(k, {...rec, dessertIds:(src.dessertIds||[]).slice(), snackIds:(src.snackIds||[]).slice()});
  }
  orderDraft = null; render();
}
/** 용역부 식단에 붙일 추가 메뉴 선택 UI(등록된 활성 메뉴만, 이미 넣은 건 제외) */
function serviceMenuPicker(dateKey, cat, selectedIds){
  const candidates = (S.serviceMenus||[]).filter(sm=>sm.category===cat && sm.isActive!==false && !selectedIds.includes(sm.id));
  if(!(S.serviceMenus||[]).some(sm=>sm.category===cat && sm.isActive!==false)){
    return `<span class="muted" style="font-size:11px;">메뉴 관리 → 용역부 추가 메뉴에서 ${cat}을 먼저 등록하세요</span>`;
  }
  if(!candidates.length) return `<span class="muted" style="font-size:11px;">등록된 ${cat}을 모두 넣었습니다</span>`;
  return `<select style="width:100%;font-size:11.5px;" onchange="addServiceMenuToDay('${dateKey}','${cat}',this.value)">
    <option value="">+ ${cat} 추가…</option>
    ${candidates.map(sm=>`<option value="${sm.id}">${esc(sm.name)} (${fmtWon(serviceMenuCostPerPerson(sm))})</option>`).join('')}
  </select>`;
}
function serviceChips(dateKey, cat, ids){
  if(!ids || !ids.length) return `<span class="muted" style="font-size:11px;">없음</span>`;
  return ids.map(id=>{

    if(!sm) return `<span class="chip red" style="font-size:10px;">삭제된 메뉴 <button class="iconbtn" style="width:14px;height:14px;font-size:9px;" onclick="removeServiceMenuFromDay('${dateKey}','${cat}','${id}')">✕</button></span>`;

      <button class="iconbtn no-print" style="width:15px;height:15px;font-size:9px;" onclick="removeServiceMenuFromDay('${dateKey}','${cat}','${id}')">✕</button></span>`;

  return (day.lunch.slots||[]).filter(s=>s.id).map(s=>{ const m=menuById(s.id); return {cat:s.cat, name:m?m.name:'-'}; });

/* ===================== 용역부 간식표 (날짜별 기입) =====================
 * 데이터는 예전부터 쓰던 날짜별 간식 기록(mealPlan/<날짜>.snack.items)을 그대로 쓴다.
 * 새 구조를 만들지 않았으므로 지금까지 적어둔 간식이 그대로 살아 있고, 재료구매 집계도 그대로 잡힌다. */
function snackItemsOf(dateKey){
  const day = S.mealPlan[dateKey];
  return (day && day.snack && day.snack.items) || [];
}
/* 간식 한 줄은 세 가지 상태를 가진다.
 *   - 재료·상품 관리 항목에 연결(ingId) : 단가 = 구매가 ÷ 구매수량 (기본단위 1개당)
 *   - 메뉴 관리 항목에 연결(menuId)     : 단가 = 그 메뉴의 1인 원가
 *   - 직접 입력(연결 없음)              : 예전처럼 unitPrice 를 손으로 적는다(하위호환)
 * 연결된 항목이 삭제됐으면 조용히 직접 입력으로 취급해, 저장된 이름·단가가 남아있게 한다. */
function snackLinkOf(it){
  if(it && it.ingId){ const reg = ingredientById(it.ingId); if(reg) return {kind:'ing', reg}; }
  if(it && it.menuId){ const m = menuById(it.menuId); if(m) return {kind:'menu', menu:m}; }
  return {kind:'free'};
}
function snackItemName(it){
  const L = snackLinkOf(it);
  if(L.kind==='ing') return L.reg.name;
  if(L.kind==='menu') return L.menu.name;
  return (it && it.name) || '';
}
function snackItemUnit(it){
  const L = snackLinkOf(it);
  if(L.kind==='ing') return L.reg.baseUnit || '개';
  if(L.kind==='menu') return '인분';
  return '개';
}
function snackItemUnitPrice(it){
  const L = snackLinkOf(it);
  if(L.kind==='ing') return L.reg.purchaseQty ? (L.reg.purchasePrice||0)/L.reg.purchaseQty : 0;
  if(L.kind==='menu') return menuCost(L.menu);
  return Number(it && it.unitPrice) || 0;
}
function snackItemSubtotal(it){ return (Number(it && it.qty)||0) * snackItemUnitPrice(it); }
function snackDayTotal(dateKey){
  return snackItemsOf(dateKey).reduce((s,it)=>s + snackItemSubtotal(it), 0);
}
/** 분류 이름만 보고 "간식 성격"인지 판단한다.
 *  분류는 사용자가 직접 추가할 수 있으므로(간식·후식·디저트 등 무엇을 만들든) 고정 목록 대신 이름으로 본다. */
const SNACK_CAT_RE = /간식|후식|디저트/;
function isSnackCat(c){ return SNACK_CAT_RE.test(String(c||'')); }
/** 간식 줄의 "품목 선택" 드롭다운 — 재료·상품 관리와 메뉴 관리에 등록된 것만 보여준다(임의 생성 없음).
 *  분류가 간식·후식·디저트인 항목을 맨 위 묶음으로 따로 올려, 간식표에서 바로 고를 수 있게 한다.
 *  나머지는 아래에 분류별로 묶여 그대로 남는다(무엇이든 고를 수 있어야 하므로 감추지 않는다). */
function snackLinkOptions(it){
  const cur = (it && it.ingId) ? ('ing:'+it.ingId) : ((it && it.menuId) ? ('menu:'+it.menuId) : '');
  const sortKo = (a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko');
  const opt = (v,label)=>`<option value="${v}"${cur===v?' selected':''}>${esc(label)}</option>`;
  const group = (label, opts)=> opts ? `<optgroup label="${esc(label)}">${opts}</optgroup>` : '';

  const ings = (S.ingredients||[]).slice().sort(sortKo);
  const menus = (S.menus||[]).slice().sort(sortKo);

  // 1) 간식 묶음 — 재료·상품이 먼저, 이어서 같은 성격의 메뉴
  const snackIngs  = ings.filter(g=>isSnackCat(g.category));
  const snackMenus = menus.filter(m=>isSnackCat(m.category));
  const snackOpts = snackIngs.map(g=>opt('ing:'+g.id, g.name + ' · 상품')).join('')
                  + snackMenus.map(m=>opt('menu:'+m.id, m.name + ' · 메뉴')).join('');

  // 2) 나머지 재료·상품 — 분류별 묶음(분류 순서는 재료·상품 관리와 동일)
  const restIngs = ings.filter(g=>!isSnackCat(g.category));
  const catRank = c => { const i = ING_CATS.indexOf(c); return i<0 ? 999 : i; };
  const ingCats = [...new Set(restIngs.map(g=>g.category||'기타'))]
    .sort((a,b)=> (catRank(a)-catRank(b)) || a.localeCompare(b,'ko'));
  const restIngGroups = ingCats.map(c=>
    group('재료·상품 · '+c, restIngs.filter(g=>(g.category||'기타')===c).map(g=>opt('ing:'+g.id, g.name)).join(''))
  ).join('');

  // 3) 나머지 메뉴
  const restMenus = menus.filter(m=>!isSnackCat(m.category));

  return opt('','직접 입력')
    + group('간식 · 후식', snackOpts)
    + restIngGroups
    + group('메뉴 관리', restMenus.map(m=>opt('menu:'+m.id, m.name)).join(''));
}
/** 품목 연결을 바꾼다. 연결하면 이름도 등록된 이름으로 맞추고, 직접 입력으로 되돌리면 이름은 그대로 둔다. */
async function setSnackItemLink(key, idx, val){
  const day = S.mealPlan[key]; if(!day || !day.snack || !day.snack.items[idx]) return;
  const it = day.snack.items[idx];
  if(val && val.indexOf('ing:')===0){
    it.ingId = val.slice(4); it.menuId = '';
    const reg = ingredientById(it.ingId); if(reg) it.name = reg.name;
  } else if(val && val.indexOf('menu:')===0){
    it.menuId = val.slice(5); it.ingId = '';
    const m = menuById(it.menuId); if(m) it.name = m.name;
  } else {
    it.ingId = ''; it.menuId = '';
  }
  await saveMealPlanDay(key, day); render();
}
/** 월간 달력에서 바로 추가할 때 — 이름만 묻고 수량·단가는 주간 화면에서 다듬는다. */
async function addSnackItemByName(dateKey){
  const name = await customPromptText('추가할 간식 이름을 입력해 주세요.', '예: 초코파이');
  if(!name || !name.trim()) return;
  const day = S.mealPlan[dateKey] || defaultDay(new Date(dateKey+'T00:00:00').getDay()-1, dateKey);
  day.snack = day.snack || {items:[]};
  day.snack.items.push({name:name.trim(), qty:serviceHeadcount()||1, unitPrice:0});
  await saveMealPlanDay(dateKey, day);
  render();
}

  <div class="card tight" style="margin-top:6px;"><div class="flex-between"><span class="muted" style="font-size:12px;">${serviceMonth.y}년 ${serviceMonth.m+1}월 용역부 총비용(해당 월 날짜 기준)</span><b class="num">${fmtWon(monthTotal)}</b></div></div>
  <p class="muted" style="font-size:12px;margin-top:6px;">※ 칸을 클릭하면 해당 주간 편집 화면으로 이동합니다. 각 칸의 "← 날짜"는 그 도시락이 어느 날 영업부 식단을 가져오는지 나타냅니다.</p>`;
}

/* ===================== 재료구매 / 발주 =====================
 * 흐름: 식단 작성 → 메뉴별 실제 사용 재료 자동 계산(메뉴에 등록된 값 그대로, 추정 없음)
 *       → 한 주간 동일 재료 합산 → 실제 구매단위로 올림 발주수량 계산 → 등록된 상품링크로 주문
 *       → 품목별 발주완료 체크 */
function shiftOrderWeek(dir){ orderWeekMonday = addDays(orderWeekMonday, dir*7); orderDraft=null; render(); }
let orderWeekMonday = mondayOf(new Date());
let includeSnackInOrder = true;

/** 레거시(재료·상품 미연결) 재료 행의 소계 계산. g/ml 은 원/kg·L 관례 유지(하위호환), 그 외는 1단위당 가격. */
function legacyLineCost(qty, unit, price){
  if(unit==='g'||unit==='ml') return Math.round((qty/1000)*(price||0));
  return Math.round(qty*(price||0));
}
function supplierName(id){ const s=S.suppliers.find(x=>x.id===id); return s?s.name:''; }

/** 지정한 주의 식단(+간식)을 바탕으로 재료 발주 집계를 계산하는 순수 함수.
 *  전역 orderDraft를 건드리지 않으므로 대시보드 등 다른 화면에서도 "읽기 전용" 미리보기로 재사용 가능. */
async function buildOrderAggregation(monday, opts){
  const includeSnack = opts && 'includeSnack' in opts ? opts.includeSnack : includeSnackInOrder;
  const includeService = opts && 'includeService' in opts ? opts.includeService : (S.settings && S.settings.serviceIncludeInOrder !== false);
  await ensureWeekLoaded(monday);
  await ensureServiceWeekLoaded(monday);
  const dates = weekDates(monday);
  const agg = {}; // groupKey -> {ingId,name,unit,qty,unitPrice}
  const deliveryLines = [];
  dates.forEach((d,wi)=>{
    const key = toKey(d);
    const day = S.mealPlan[key];
    if(!day) return;
    if(day.lunch.type==='delivery'){
      deliveryLines.push({label:`${WD_LABEL[wi]} ${fmtMD(d)} · ${day.lunch.theme}`, cost: (day.lunch.deliveryCost||0)*S.settings.headcount});
    } else {
      (day.lunch.slots||[]).forEach(slot=>{
        if(!slot.id) return;
        const m = menuById(slot.id); if(!m) return;
        (m.ingredients||[]).forEach(ing=>{
          const k = ing.ingId ? ('ing:'+ing.ingId) : ('name:'+ing.n+'|'+ing.u);
          const reg = ing.ingId ? ingredientById(ing.ingId) : null;
          if(!agg[k]) agg[k] = {ingId: ing.ingId||'', name: ing.n, unit: (reg&&reg.baseUnit)||ing.u, qty:0, unitPrice: ing.p};
          const perPerson = ingRowPerPersonQty(ing);
          const fixed = ingRowFixedQty(ing);
          // 연결된 재료는 등록된 기본단위로 바꿔서 합산한다(발주수량 계산이 구매단위 기준이므로).
          agg[k].qty += (perPerson*S.settings.headcount + fixed) * ingRowBaseFactor(ing);
        });
      });
    }
    if(includeSnack && day.snack && day.snack.items){
      day.snack.items.forEach(it=>{
        const qty = Number(it.qty)||0;
        if(!qty) return;
        const L = snackLinkOf(it);
        if(L.kind==='ing'){
          // 재료·상품에 연결된 간식은 그 상품 줄에 그대로 합쳐진다(수량은 이미 기본단위 기준)
          const k = 'ing:'+it.ingId;
          if(!agg[k]) agg[k] = {ingId: it.ingId, name: L.reg.name, unit: L.reg.baseUnit||'개', qty:0, unitPrice:0};
          agg[k].qty += qty;
        } else if(L.kind==='menu'){
          // 메뉴에 연결된 간식은 그 메뉴의 재료를 "수량(인분)"만큼 풀어서 합친다.
          // (고정수량 재료는 1회분이므로 여기서 더하지 않는다 — 용역부 기본식사 합산과 같은 규칙)
          (L.menu.ingredients||[]).forEach(ing=>{
            const k = ing.ingId ? ('ing:'+ing.ingId) : ('name:'+ing.n+'|'+ing.u);
            const reg = ing.ingId ? ingredientById(ing.ingId) : null;
            if(!agg[k]) agg[k] = {ingId: ing.ingId||'', name: ing.n, unit: (reg&&reg.baseUnit)||ing.u, qty:0, unitPrice: ing.p};
            agg[k].qty += ingRowPerPersonQty(ing) * qty * ingRowBaseFactor(ing);
          });
        } else {
          const k = 'name:'+it.name+'|개';
          if(!agg[k]) agg[k] = {ingId:'', name:it.name, unit:'개', qty:0, unitPrice: Number(it.unitPrice)||0};
          agg[k].qty += qty;
        }
      });
    }
  });
  /* 🍱 용역부 몫 합산 — 별도의 계산 방식을 새로 만들지 않고, 위와 똑같은 집계 구조에 더한다.
   *  (1) 용역부 추가 메뉴(후식·간식): 실제 구매상품에 연결돼 있으면 그 상품으로, 아니면 이름 기준으로 합산
   *  (2) 기본 식사 몫: 설정에서 켠 경우에만, 연결된 영업부 식단 메뉴의 재료를 용역부 인원분만큼 추가 */
  if(includeService){
    const shc = serviceHeadcount();
    if(shc > 0){
      dates.forEach(d=>{
        const skey = toKey(d);
        if(serviceDayType(skey)!=='lunchbox') return;
        const rec = S.serviceMeals[skey];
        if(!rec) return;
        [...(rec.dessertIds||[]), ...(rec.snackIds||[])].forEach(id=>{
          const sm = serviceMenuById(id);
          if(!sm || sm.isActive===false || !(sm.qtyPerPerson>0)) return;
          if(sm.ingId){
            const k = 'ing:'+sm.ingId;
            const reg = ingredientById(sm.ingId);
            if(!agg[k]) agg[k] = {ingId: sm.ingId, name: (reg&&reg.name)||sm.name, unit: (reg&&reg.baseUnit)||sm.unit, qty:0, unitPrice: 0};
            const f = reg ? unitConvFactor(sm.unit, reg.baseUnit) : null;
            agg[k].qty += sm.qtyPerPerson * shc * (f === null ? 1 : f);
          } else {
            const k = 'svc:'+sm.id;
            const perUnit = sm.qtyPerPerson ? (sm.costPerPerson||0)/sm.qtyPerPerson : 0;
            // 직접입력 품목은 기존 레거시 단가 규칙(g·ml은 원/kg·L, 그 외는 1단위당 가격)에 맞춘다
            const unitPrice = (sm.unit==='g'||sm.unit==='ml') ? perUnit*1000 : perUnit;
            if(!agg[k]) agg[k] = {ingId:'', name: sm.name+' (용역부)', unit: sm.unit, qty:0, unitPrice};
            agg[k].qty += sm.qtyPerPerson * shc;
          }
        });
        if(S.settings && S.settings.serviceBaseMealInOrder && rec.useSourceMeal!==false && rec.sourceMealDate){
          const src = S.mealPlan[rec.sourceMealDate];
          if(src && src.lunch && src.lunch.type==='cook'){
            (src.lunch.slots||[]).forEach(slot=>{
              if(!slot.id) return;
              const m = menuById(slot.id); if(!m) return;
              (m.ingredients||[]).forEach(ing=>{
                const k = ing.ingId ? ('ing:'+ing.ingId) : ('name:'+ing.n+'|'+ing.u);
                const reg = ing.ingId ? ingredientById(ing.ingId) : null;
                if(!agg[k]) agg[k] = {ingId: ing.ingId||'', name: ing.n, unit: (reg&&reg.baseUnit)||ing.u, qty:0, unitPrice: ing.p};
                agg[k].qty += ingRowPerPersonQty(ing) * shc * ingRowBaseFactor(ing); // 고정수량 재료는 1회분이므로 추가하지 않음
              });
            });
          }
        }
      });
    }
  }
  const items = Object.values(agg).map(a=>{
    const reg = a.ingId ? ingredientById(a.ingId) : null;
    const baseQty = Math.round(a.qty*100)/100;
    if(reg && reg.purchaseQty>0){
      const orderUnits = Math.ceil(baseQty / reg.purchaseQty); // 부족하지 않도록 항상 올림
      return {
        name: reg.name, unit: reg.baseUnit, baseQty,
        purchaseUnit: reg.purchaseUnit || (reg.baseUnit+' 단위'), purchaseQty: reg.purchaseQty,
        orderUnits, unitPrice: reg.purchasePrice||0,
        subtotal: orderUnits*(reg.purchasePrice||0),
        supplier: supplierName(reg.supplierId) || '',
        productUrl: reg.url || '',
        category: reg.category || '기타',
        ingId: a.ingId, done:false,
      };
    }
    // 미등록(직접입력) 재료: 예전 방식 그대로, 구매단위 개념 없이 필요량 자체를 표시
    return {
      name: a.name, unit: a.unit, baseQty,
      purchaseUnit:'', purchaseQty:0, orderUnits:null,
      unitPrice: a.unitPrice, subtotal: legacyLineCost(baseQty, a.unit, a.unitPrice),
      supplier: (S.suppliers[0]&&S.suppliers[0].name)||'',
      productUrl:'', category:'미분류(직접입력)', ingId:'', done:false,
    };
  }).sort((x,y)=> (x.category.localeCompare(y.category)) || (y.subtotal-x.subtotal));
  const total = items.reduce((s,i)=>s+i.subtotal,0) + deliveryLines.reduce((s,l)=>s+l.cost,0);
  return {from: toKey(dates[0]), to: toKey(dates[4]), items, deliveryLines, total};
}
async function calcOrderDraft(){ orderDraft = await buildOrderAggregation(orderWeekMonday); }
function setOrderSupplier(idx, val){ orderDraft.items[idx].supplier = val; }
function toggleIncludeSnack(v){ includeSnackInOrder = v; orderDraft=null; render(); }
function toggleOrderGroupBySupplier(v){ orderGroupBySupplier = v; render(); }
async function confirmOrder(){
  if(!orderDraft) return;
  const order = {
    startDate: orderDraft.from, endDate: orderDraft.to,
    createdAt: new Date().toISOString(),
    items: orderDraft.items, totalCost: orderDraft.total,
    status:'발주완료', payment:{status:'미결제', method:'', paidAt:'', memo:''},
  };
  await addOrderRec(order);
  expandedOrderId = order.id;
  orderDraft = null;
  render();
}
async function togglePayment(id){
  const o = S.orders.find(x=>x.id===id); if(!o) return;
  if(o.payment.status==='미결제'){
    const method = prompt('결제 수단을 입력하세요 (예: 법인카드, 계좌이체)', '법인카드') || '기타';
    o.payment = {status:'결제완료', method, paidAt: toKey(new Date()), memo:o.payment.memo||''};
  } else {
    o.payment = {status:'미결제', method:'', paidAt:'', memo:o.payment.memo||''};
  }
  await updateOrderRec(id, {payment:o.payment});
  render();
}
async function setOrderStatus(id, status){ await updateOrderRec(id, {status}); render(); }
async function removeOrder(id){ if(!await customConfirm('발주 내역을 삭제할까요?')) return; await deleteOrderRec(id); render(); }
function toggleExpandOrder(id){ expandedOrderId = (expandedOrderId===id) ? null : id; render(); }
/** 예전에 저장된 발주 내역(items에 done 필드가 없음)도 안전하게 처리 — 없으면 모두 false로 취급 */
function orderItemDone(it){ return !!it.done; }
/** 예전(레거시) 발주 내역의 item 형식({name,unit,qty,unitPrice,supplier,subtotal})을
 *  현재 화면이 기대하는 형식으로 안전하게 보정한다. 저장된 데이터는 건드리지 않고 표시용으로만 변환. */
function normalizeOrderItem(it){
  return {
    name: it.name, unit: it.unit,
    baseQty: (it.baseQty!==undefined && it.baseQty!==null) ? it.baseQty : (it.qty||0),
    purchaseUnit: it.purchaseUnit || '',
    purchaseQty: it.purchaseQty || 0,
    orderUnits: (it.orderUnits!==undefined) ? it.orderUnits : null,
    unitPrice: it.unitPrice, subtotal: it.subtotal||0,
    supplier: it.supplier || '',
    productUrl: it.productUrl || '',
    category: it.category || '미분류(직접입력)',
    ingId: it.ingId || '', done: !!it.done,
  };
}
async function toggleOrderItemDone(orderId, idx){
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  const items = o.items.map((it,i)=> i===idx ? {...it, done: !orderItemDone(it)} : {...it, done: orderItemDone(it)});
  await updateOrderRec(orderId, {items});
  render();
}
async function toggleOrderAllDone(orderId, val){
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  const items = o.items.map(it=>({...it, done: val}));
  await updateOrderRec(orderId, {items});
  render();
}
/** 식단표 탭에서 "이번 주 발주 보기"로 바로 넘어와 자동으로 집계까지 실행 */
async function gotoOrderForWeek(monday){
  orderWeekMonday = mondayOf(monday);
  setTab('order');
  await calcOrderDraft();
  render();
}

function renderOrderItemsTable(items, {withDone=false, orderId=null}={}){
  const byCat = {};
  items.forEach(it=>{ (byCat[it.category]=byCat[it.category]||[]).push(it); });
  const cats = Object.keys(byCat).sort();
  return cats.map(cat=>{
    let groups;
    if(orderGroupBySupplier){
      const bySup = {};
      byCat[cat].forEach(it=>{ const s=it.supplier||'거래처 미지정'; (bySup[s]=bySup[s]||[]).push(it); });
      groups = Object.entries(bySup);
    } else {
      groups = [[null, byCat[cat]]];
    }
    const catTotal = byCat[cat].reduce((s,it)=>s+it.subtotal,0);
    const body = groups.map(([supName, rows])=>{
      const supHeader = supName ? `<tr><td colspan="${withDone?6:5}" style="background:var(--surface-2);font-weight:700;font-size:11.5px;">거래처: ${esc(supName)}</td></tr>` : '';
      const rowsHtml = rows.map(it=>{
        const idx = items.indexOf(it);
        const qtyLabel = it.orderUnits!==null
          ? `<b class="num">${it.orderUnits.toLocaleString()}</b> ${esc(it.purchaseUnit)} <span class="muted" style="font-size:10.5px;">(${it.baseQty.toLocaleString()}${esc(it.unit)} 필요)</span>`
          : `<b class="num">${it.baseQty.toLocaleString()}</b> ${esc(it.unit)} <span class="chip amber" style="font-size:9.5px;padding:1px 6px;">구매단위 미등록</span>`;
        const linkBtn = it.productUrl ? `<a class="btn small" href="${esc(it.productUrl)}" target="_blank" rel="noopener">🔗 주문</a>` : '<span class="muted" style="font-size:11px;">-</span>';
        const doneCell = withDone ? `<td style="text-align:center;"><input type="checkbox" ${orderItemDone(it)?'checked':''} onchange="toggleOrderItemDone('${orderId}',${idx})"></td>` : '';
        return `<tr class="${withDone&&orderItemDone(it)?'done-row':''}">
          <td>${esc(it.name)}</td>
          <td class="num">${qtyLabel}</td>
          <td>${it.supplier?esc(it.supplier):'<span class="muted">미지정</span>'}</td>
          <td>${linkBtn}</td>
          <td class="num">${fmtWon(it.subtotal)}</td>
          ${doneCell}
        </tr>`;
      }).join('');
      return supHeader+rowsHtml;
    }).join('');
    return `<div class="order-catgroup">
      <div class="ocg-head"><span><span class="badge-ingcat" style="background:var(--accent-soft);color:var(--accent-strong);">${esc(cat)}</span></span><span class="num muted">${fmtWon(catTotal)}</span></div>
      <div class="twrap"><table><thead><tr><th>재료명</th><th class="num">발주수량</th><th>거래처</th><th>링크</th><th class="num">소계</th>${withDone?'<th>완료</th>':''}</tr></thead><tbody>${body}</tbody></table></div>
    </div>`;
  }).join('');
}

function renderOrder(){
  const dates = weekDates(orderWeekMonday);
  const draftBlock = () => {
    if(!orderDraft) return `<div class="empty">기간을 확인하고 "재료 집계하기"를 눌러 발주서를 만들어보세요.</div>`;
    const deliveryRows = orderDraft.deliveryLines.map(l=>`<div class="supplier-subtotal"><span>🚚 ${esc(l.label)} (배달·재료발주 제외)</span><b class="num">${fmtWon(l.cost)}</b></div>`).join('');
    const linkChips = [...new Map(orderDraft.items.filter(it=>it.productUrl).map(it=>[it.productUrl,it])).values()]
      .map(it=>`<a class="btn small" href="${esc(it.productUrl)}" target="_blank" rel="noopener">🔗 ${esc(it.name)} 상품 주문</a>`).join('');
    return `
      <div class="grid cols-3" style="margin-bottom:14px;">
        <div class="card stat-tile tight"><span class="label">이번 주 발주 예상 총액</span><span class="value num">${fmtWon(orderDraft.total)}</span><span class="sub">${orderDraft.items.length}개 품목</span></div>
        <div class="card stat-tile tight"><span class="label">구매단위 미등록 품목</span><span class="value num" style="color:${orderDraft.items.some(i=>i.orderUnits===null)?'var(--amber)':'inherit'}">${orderDraft.items.filter(i=>i.orderUnits===null).length}개</span><span class="sub">재료·상품 관리에서 등록 권장</span></div>
        <div class="card stat-tile tight"><span class="label">기간</span><span class="value" style="font-size:15px;">${orderDraft.from} ~ ${orderDraft.to}</span></div>
      </div>
      ${linkChips ? `<div class="chip-row" style="margin-bottom:12px;">${linkChips}</div>` : ''}
      ${renderOrderItemsTable(orderDraft.items)}
      ${deliveryRows}
      <div class="flex-between" style="margin-top:14px;">
        <span class="muted" style="font-size:12px;">발주 확정 저장 후, 아래 발주 내역에서 실제로 주문한 품목을 하나씩 체크하세요.</span>
        <button class="btn primary" onclick="confirmOrder()">✔ 발주 확정 저장</button>
      </div>`;
  };
  const historyRows = S.orders.map(o=>{
    const items = (o.items||[]).map(normalizeOrderItem);
    const doneCount = items.filter(orderItemDone).length;
    const allDone = items.length>0 && doneCount===items.length;
    const expanded = expandedOrderId===o.id;
    const supBreak = {};
    items.forEach(it=>{ const s=it.supplier||'거래처 미지정'; supBreak[s]=(supBreak[s]||0)+it.subtotal; });
    const detail = expanded ? `
      <tr><td colspan="6" style="padding:12px;background:var(--surface-2);">
        <div class="flex-between" style="margin-bottom:8px;">
          <label class="field" style="flex-direction:row;align-items:center;gap:6px;font-size:12px;"><input type="checkbox" ${allDone?'checked':''} onchange="toggleOrderAllDone('${o.id}',this.checked)"> 전체 발주 완료</label>
          <div class="order-progress" style="max-width:220px;"><span class="muted" style="font-size:11px;">${doneCount}/${items.length}</span><div class="bar-bg"><div class="bar-fg" style="width:${items.length?Math.round(doneCount/items.length*100):0}%;"></div></div></div>
        </div>
        ${renderOrderItemsTable(items, {withDone:true, orderId:o.id})}
        <div class="grid cols-3" style="margin-top:10px;">
          ${Object.entries(supBreak).map(([s,v])=>`<div class="supplier-subtotal"><span>${esc(s)}</span><b class="num">${fmtWon(v)}</b></div>`).join('')}
        </div>
      </td></tr>` : '';
    return `<tr>
      <td><a class="linklike" onclick="toggleExpandOrder('${o.id}')">${expanded?'▼':'▶'} ${o.startDate} ~ ${o.endDate}</a></td>
      <td class="num">${fmtWon(o.totalCost)}</td>
      <td>
        <select onchange="setOrderStatus('${o.id}',this.value)">
          ${['대기','발주완료','입고완료'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td>${items.length? `<span class="chip ${allDone?'green':'amber'}">${doneCount}/${items.length} 완료</span>` : '<span class="muted">-</span>'}</td>

/* ===================== 원가분석표 ===================== */
function shiftCostWeek(dir){ costWeekMonday = addDays(costWeekMonday, dir*7); render(); }
/** 이번 조회 주간의 "재료별" 원가 합계(메뉴 내 재료 + 간식 항목). 발주수량과 무관하게 순수 원가 관점의 분석용. */
function computeWeekIngredientCosts(monday, includeSnack){
  const dates = weekDates(monday);
  const agg = {};
  dates.forEach(d=>{
    const day = S.mealPlan[toKey(d)];
    if(!day) return;
    if(day.lunch.type==='cook'){
      (day.lunch.slots||[]).forEach(slot=>{
        if(!slot.id) return; const m=menuById(slot.id); if(!m) return;
        (m.ingredients||[]).forEach(ing=>{
          const key = ing.ingId ? ('i:'+ing.ingId) : ('n:'+ing.n);
          const name = ing.ingId ? ((ingredientById(ing.ingId)||{}).name || ing.n) : ing.n;
          const unitCost = ingRowUnitCost(ing);
          const cost = ingRowPerPersonQty(ing)*S.settings.headcount*unitCost + ingRowFixedQty(ing)*unitCost;
          if(!agg[key]) agg[key] = {name, cost:0};
          agg[key].cost += cost;
        });
      });
    }
    if(includeSnack && day.snack && day.snack.items){
      day.snack.items.forEach(it=>{
        const key = 's:'+it.name;
        if(!agg[key]) agg[key] = {name: it.name+' (간식)', cost:0};
        agg[key].cost += (it.qty*it.unitPrice||0);
      });
    }
  });
  return Object.values(agg).sort((a,b)=>b.cost-a.cost);
}
function renderCost(){
  const dates = weekDates(costWeekMonday);
  const budget = S.settings.budgetPerPerson;
  let totalWeek=0, cookCount=0, cookPerPersonSum=0;
  const rows = dates.map((d,i)=>{
    const key=toKey(d);
    const day = S.mealPlan[key];
    const c = dayCost(key);
    totalWeek += c.total;
    if(day && day.lunch.type==='cook'){ cookCount++; cookPerPersonSum+=c.perPerson; }
    const menuSummary = day ? (day.lunch.type==='delivery' ? day.lunch.theme+' 배달' : (day.lunch.slots||[]).map(slot=>{const m=menuById(slot.id);return m?m.name:'';}).filter(Boolean).join(', ')) : '-';
    const pct = day && day.lunch.type==='cook' && budget ? Math.round((c.perPerson/budget)*100) : null;
    return {i,d,key,day,c,menuSummary,pct};
  });
  const tableRows = rows.map(r=>`
    <tr>
      <td>${WD_LABEL[r.i]} ${fmtMD(r.d)}</td>
      <td>${r.day?esc(r.day.lunch.theme):'-'}</td>

      <td class="num">${fmtWon(r.c.total)}</td>

    </tr>`).join('');

  const avgPerPerson = cookCount? cookPerPersonSum/cookCount : 0;
  const maxVal = Math.max(budget, ...rows.map(r=>r.c.perPerson), 1);
  const barW = 100, gap=26, chartW = rows.length*(barW+gap)+40, chartH=170;
  const bars = rows.map((r,idx)=>{
    const h = Math.round((r.c.perPerson/maxVal)*120);

    return `<rect class="bar ${over?'over':''}" x="${x}" y="${140-h}" width="${barW}" height="${h}" rx="3"/>
      <text x="${x+barW/2}" y="156" text-anchor="middle" font-size="11">${WD_LABEL[idx]}</text>

  }).join('');
  const targetY = 140-Math.round((budget/maxVal)*120);
  const chart = `<svg class="barchart" viewBox="0 0 ${chartW} 170"><line class="gridline" x1="30" y1="140" x2="${chartW-10}" y2="140"/>
    <line class="target" x1="30" y1="${targetY}" x2="${chartW-10}" y2="${targetY}"/>
    <text x="${chartW-12}" y="${targetY-5}" text-anchor="end" font-size="10.5" fill="var(--amber)">목표 ${budget.toLocaleString()}원</text>
    ${bars}</svg>`;

  const catTotals = {};
  rows.forEach(r=>{ if(r.day && r.day.lunch.type==='cook'){ (r.day.lunch.slots||[]).forEach(slot=>{ if(!slot.id) return; const m=menuById(slot.id); if(m){ catTotals[slot.cat]=(catTotals[slot.cat]||0)+menuCost(m); } }); } });
  const catMax = Math.max(...Object.values(catTotals),1);
  const catBars = Object.entries(catTotals).map(([cat,v])=>`
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:44px;font-size:11.5px;color:var(--ink-soft);">${cat}</span>
      <div style="flex:1;background:var(--surface-2);border-radius:5px;overflow:hidden;height:12px;"><div style="width:${(v/catMax)*100}%;background:var(--accent);height:100%;"></div></div>
      <span class="num" style="font-size:11.5px;width:56px;text-align:right;">${fmtWon(v)}</span>
    </div>`).join('');

  // 메뉴별 원가: 이번 조회 주간에 실제로 편성된 메뉴만 사용 횟수와 함께 랭킹
  const menuUsage = {};
  rows.forEach(r=>{ if(r.day && r.day.lunch.type==='cook'){ (r.day.lunch.slots||[]).forEach(slot=>{ if(!slot.id) return; const m=menuById(slot.id); if(!m) return; if(!menuUsage[m.id]) menuUsage[m.id]={menu:m,count:0}; menuUsage[m.id].count++; }); } });
  const menuRankRows = Object.values(menuUsage).sort((a,b)=>menuCost(b.menu)-menuCost(a.menu)).map(u=>`
    <tr><td>${esc(u.menu.name)}</td><td><span class="badge-cat">${esc(u.menu.category)}</span></td><td class="num">${u.count}회</td><td class="num">${fmtWon(menuCost(u.menu))}</td><td class="num">${fmtWon(menuCost(u.menu)*S.settings.headcount*u.count)}</td></tr>`).join('')
    || `<tr><td colspan="5" class="empty">이번 조회 주간에 편성된 메뉴가 없습니다</td></tr>`;

  // 재료별 비용: 순수 원가 관점(발주수량과 무관), 상위 12개
  const ingCosts = computeWeekIngredientCosts(costWeekMonday, true).slice(0,12);
  const ingMax = Math.max(...ingCosts.map(i=>i.cost),1);
  const ingRows = ingCosts.map(i=>`
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:90px;font-size:11.5px;color:var(--ink-soft);" class="wrap">${esc(i.name)}</span>
      <div style="flex:1;background:var(--surface-2);border-radius:5px;overflow:hidden;height:11px;"><div style="width:${(i.cost/ingMax)*100}%;background:var(--accent);height:100%;"></div></div>
      <span class="num" style="font-size:11.5px;width:70px;text-align:right;">${fmtWon(i.cost)}</span>
    </div>`).join('') || '<span class="muted">데이터 없음</span>';

  // 거래처별 구매금액: 이 조회 주간에 확정된 발주 기준
  const weekOrdersInRange = S.orders.filter(o=>o.startDate===toKey(dates[0]));
  const supTotals = {};
  weekOrdersInRange.forEach(o=>(o.items||[]).forEach(it=>{ const s=it.supplier||'거래처 미지정'; supTotals[s]=(supTotals[s]||0)+(it.subtotal||0); }));
  const supRows = Object.entries(supTotals).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<tr><td>${esc(s)}</td><td class="num">${fmtWon(v)}</td></tr>`).join('')
    || `<tr><td colspan="2" class="empty">이 조회 주간에 확정된 발주 내역이 없습니다</td></tr>`;

  return `
  <div class="view-head">
    <div class="weeknav">
      <button class="iconbtn" onclick="shiftCostWeek(-1)">◀</button>
      <span class="range">${fmtMD(dates[0])} ~ ${fmtMD(dates[4])}</span>
      <button class="iconbtn" onclick="shiftCostWeek(1)">▶</button>
    </div>
    <button class="btn no-print" onclick="window.print()">🖨 인쇄</button>
  </div>
  <div class="grid cols-3" style="margin-bottom:18px;">
    <div class="card stat-tile"><span class="label">주간 총 식재료비</span><span class="value num">${fmtWon(totalWeek)}</span><span class="sub">간식 포함</span></div>
    <div class="card stat-tile"><span class="label">조리일 1인 평균</span><span class="value num">${fmtWon(avgPerPerson)}</span><span class="sub">목표 ${fmtWon(budget)}</span></div>
    <div class="card stat-tile"><span class="label">목표 대비</span><span class="value num" style="color:${avgPerPerson>budget?'var(--danger)':'var(--accent)'}">${budget?Math.round((avgPerPerson/budget)*100):0}%</span><span class="sub">${avgPerPerson>budget?'예산 초과':'예산 이내'}</span></div>
  </div>
  <div class="grid cols-2" style="align-items:start;">
    <div class="card">
      <div class="section-title">1인 단가 추이</div>
      <div class="twrap" style="border:none;">${chart}</div>
    </div>
    <div class="card">
      <div class="section-title">분류별 원가 비중 (이번 조회 주간)</div>
      <div class="stack">${catBars||'<span class="muted">데이터 없음</span>'}</div>
    </div>
  </div>
  <div class="section-title" style="margin-top:20px;">일자별 상세</div>
  <div class="twrap"><table><thead><tr><th>날짜</th><th>테마</th><th class="wrap">메뉴 구성</th><th class="num">1인 단가</th><th class="num">총 재료비</th><th>목표대비</th></tr></thead><tbody>${tableRows}</tbody></table></div>

  <div class="grid cols-2" style="align-items:start;margin-top:20px;">
    <div class="card">
      <div class="section-title">메뉴별 원가 <span class="hint">이번 조회 주간 기준</span></div>
      <div class="twrap"><table><thead><tr><th>메뉴</th><th>분류</th><th class="num">사용횟수</th><th class="num">1인 원가</th><th class="num">주간 총액</th></tr></thead><tbody>${menuRankRows}</tbody></table></div>
    </div>
    <div class="card">
      <div class="section-title">재료별 비용 <span class="hint">상위 12개 · 간식 포함</span></div>
      <div class="stack">${ingRows}</div>
    </div>
  </div>
  <div class="card" style="margin-top:14px;">
    <div class="section-title">거래처별 구매금액 <span class="hint">이번 조회 주간에 확정된 발주 기준</span></div>
    <div class="twrap"><table><thead><tr><th>거래처</th><th class="num">구매금액</th></tr></thead><tbody>${supRows}</tbody></table></div>
  </div>
  `;
}

async function updateServiceSetting(field, val){

async function updateDayTheme(idx, field, val){
  const dt = {...S.settings.dayThemes};
  dt[idx] = {...dt[idx], [field]: field==='deliveryCost'?Number(val)||0:val};

    if(val==='delivery') dt[idx].theme = dt[idx].theme==='일반'?'포케볼데이':dt[idx].theme;

/* ===================== 세트메뉴 관리 (메뉴 관리 탭) =====================
 * "제육볶음+멸치볶음+계란말이"처럼 함께 내고 싶은 메뉴를 세트로 묶어두면, 🔀 랜덤 식단 생성 시
 * 각각 따로 뽑히는 대신 이 조합이 통째로 배정된다. 세트는 새로운 메뉴가 아니라 기존 메뉴의 조합이며,
 * 절대 세트 구성을 자동으로 만들지 않고 100% 사용자가 직접 고른 조합만 저장한다.
 * 식단표·재료·발주·원가는 모두 기존 메뉴 단위로 처리된다(세트 전용 경로 없음). */
let menuSetDraft = null;      // {id, name, description, items:[{menuId,sortOrder}], randomEnabled, isActive}
let menuSetPickerQuery = '';  // 세트 편집 화면의 "기존 메뉴 검색" 입력값
function blankMenuSetDraft(){ return {id:null, name:'', description:'', items:[], randomEnabled:true, isActive:true}; }
function newMenuSetDraft(){ menuSetDraft = blankMenuSetDraft(); menuSetPickerQuery=''; render(); }
function editMenuSetDraft(id){
  const s = menuSetById(id);
  if(!s) return;
  menuSetDraft = deepClone(normalizeMenuSet(s));
  menuSetPickerQuery = '';
  render();
}
function cancelMenuSetDraft(){ menuSetDraft=null; menuSetPickerQuery=''; render(); }
function menuSetDraftSetName(val){ menuSetDraft.name=val; }
function menuSetDraftSetDescription(val){ menuSetDraft.description=val; }
function menuSetDraftToggleRandom(val){ menuSetDraft.randomEnabled = !!val; }
function menuSetDraftReindex(){ menuSetDraft.items = menuSetDraft.items.map((it,i)=>({menuId:it.menuId, sortOrder:i})); }
/** 검색 결과에서 메뉴를 눌러 세트에 추가(이미 들어있으면 무시 — 세트 안 중복 방지) */
function menuSetDraftAddMenu(menuId){
  if(!menuSetDraft || !menuId) return;
  if(menuSetDraft.items.some(it=>it.menuId===menuId)) return;
  menuSetDraft.items.push({menuId, sortOrder: menuSetDraft.items.length});
  menuSetDraftReindex();
  render();
}
function menuSetDraftRemoveItem(idx){ menuSetDraft.items.splice(idx,1); menuSetDraftReindex(); render(); }
/** 세트 안 메뉴 순서 변경(▲▼) */
function menuSetDraftMoveItem(idx, dir){
  const to = idx + dir;
  if(to<0 || to>=menuSetDraft.items.length) return;
  const arr = menuSetDraft.items;
  [arr[idx], arr[to]] = [arr[to], arr[idx]];
  menuSetDraftReindex();
  render();
}
/** 검색어 입력 시 화면 전체를 다시 그리지 않고 목록만 즉시 걸러낸다(입력 포커스 유지용).
 *  전역에도 보관해 두어 메뉴를 추가해 화면이 다시 그려져도 검색어가 유지된다. */
function menuSetPickerFilter(q){
  menuSetPickerQuery = q || '';
  const needle = menuSetPickerQuery.trim().toLowerCase();
  document.querySelectorAll('#menuSetPicker [data-search]').forEach(el=>{
    el.style.display = (!needle || el.getAttribute('data-search').includes(needle)) ? '' : 'none';
  });
}
async function saveMenuSetDraft(){
  const ids = menuSetDraft.items.map(it=>it.menuId).filter(Boolean);
  if(new Set(ids).size < 2){ await customAlert('세트는 서로 다른 메뉴 2개 이상으로 구성해주세요.'); return; }
  const names = ids.map(id=>{ const m=menuById(id); return m?m.name:''; }).filter(Boolean);
  const rec = {
    name: (menuSetDraft.name||'').trim() || names.join(' + '),
    description: (menuSetDraft.description||'').trim(),
    items: menuSetDraft.items,
    randomEnabled: menuSetDraft.randomEnabled !== false,
    isActive: menuSetDraft.isActive !== false,
  };
  if(menuSetDraft.id){ await updateMenuSetRec(menuSetDraft.id, rec); }
  else { await addMenuSetRec(rec); }
  menuSetDraft = null; menuSetPickerQuery=''; render();
}
async function removeMenuSet(id){
  const s = menuSetById(id);
  if(!await customConfirm(`"${s?s.name:''}" 세트를 삭제할까요?\n\n세트만 없어지고, 구성 메뉴와 이미 편성된 식단표는 그대로 남습니다.`)) return;
  await deleteMenuSetRec(id); render();
}

      <button class="iconbtn" style="width:24px;height:24px;" title="세트에서 빼기" onclick="menuSetDraftRemoveItem(${idx})">✕</button>

    .sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name))

        <button class="btn small ${already?'ghost':''}" ${already?'disabled':''} onclick="menuSetDraftAddMenu('${m.id}')">${already?'추가됨':'+ 추가'}</button>

  const totalCost = menuSetDraft.items.reduce((s,it)=>{ const m=menuById(it.menuId); return s + (m?menuCost(m):0); },0);
  return `
    <div class="card tight" style="background:var(--surface-2);margin-bottom:12px;">
      <div class="section-title" style="margin-bottom:8px;">${menuSetDraft.id?'세트메뉴 수정':'새 세트메뉴 추가'}</div>
      <div class="inline-form" style="margin-bottom:10px;">
        <label class="field" style="flex:1;min-width:180px;">세트 이름 <span class="muted" style="font-weight:400;">(비우면 메뉴 이름으로 자동 생성)</span>
          <input type="text" value="${esc(menuSetDraft.name)}" oninput="menuSetDraftSetName(this.value)" placeholder="예: 제육 반찬세트">
        </label>
        <label class="field" style="flex:1;min-width:180px;">설명 <span class="muted" style="font-weight:400;">(선택)</span>
          <input type="text" value="${esc(menuSetDraft.description||'')}" oninput="menuSetDraftSetDescription(this.value)" placeholder="예: 화요일 고기데이용">
        </label>
        <label class="field" style="flex-direction:row;align-items:center;gap:6px;font-size:12px;">
          <input type="checkbox" ${menuSetDraft.randomEnabled!==false?'checked':''} onchange="menuSetDraftToggleRandom(this.checked)"> 랜덤 생성에 사용
        </label>
      </div>
      <div class="grid cols-2" style="align-items:start;gap:12px;">
        <div>
          <div class="section-title" style="margin-bottom:6px;">세트 구성 <span class="hint">▲▼로 순서 변경</span></div>

        </div>
        <div>
          <div class="section-title" style="margin-bottom:6px;">기존 메뉴에서 선택 <span class="hint">메뉴 관리에 등록된 메뉴만</span></div>
          <input type="text" id="menuSetSearch" value="${esc(menuSetPickerQuery)}" placeholder="메뉴 검색 (이름·분류·테마)" style="width:100%;margin-bottom:6px;" oninput="menuSetPickerFilter(this.value)">
          <div id="menuSetPicker" style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface);">${pickerRows}</div>

        <div class="chip-row">
          <button class="btn ghost" onclick="cancelMenuSetDraft()">취소</button>
          <button class="btn primary" onclick="saveMenuSetDraft()">저장</button>
        </div>
      </div>
    </div>`;
}
/* ===================== 🍱 용역부 추가 메뉴 관리 (메뉴 관리 탭) =====================
 * 용역부에게만 추가로 나가는 후식/간식을 등록하는 화면. 실제 구매상품은 기존 "재료·상품 관리"를
 * 그대로 참조하므로(ingId) 같은 상품을 두 번 등록할 필요가 없고, 연결하면 1인 비용이 자동 계산된다.
 * 메뉴명·품목은 100% 사용자가 직접 등록한다(샘플 데이터 자동 생성 없음). */
let serviceMenuDraft = null;
function blankServiceMenuDraft(){
  return {id:null, name:'', category:'후식', description:'', qtyPerPerson:1, unit:'개', costPerPerson:0, ingId:'', url:'', isActive:true};
}
function newServiceMenuDraft(){ serviceMenuDraft = blankServiceMenuDraft(); render(); }
function editServiceMenuDraft(id){
  const sm = serviceMenuById(id);
  if(!sm) return;
  serviceMenuDraft = deepClone(normalizeServiceMenu(sm));
  render();
}
function cancelServiceMenuDraft(){ serviceMenuDraft = null; render(); }
function serviceMenuDraftSet(field, val){
  const numFields = ['qtyPerPerson','costPerPerson'];
  serviceMenuDraft[field] = numFields.includes(field) ? (Number(val)||0) : val;
  if(field==='ingId' || field==='category' || field==='qtyPerPerson') render();
}
function serviceMenuDraftToggleActive(val){ serviceMenuDraft.isActive = !!val; }
/** 실제 구매상품을 연결하면 단위를 그 상품의 기본단위로 맞춘다(수량 해석이 어긋나지 않도록). */
function serviceMenuDraftLinkProduct(ingId){
  serviceMenuDraft.ingId = ingId || '';
  if(ingId){
    const reg = ingredientById(ingId);
    if(reg) serviceMenuDraft.unit = reg.baseUnit || serviceMenuDraft.unit;
  }
  render();
}
async function saveServiceMenuDraft(){
  if(!serviceMenuDraft.name.trim()){ await customAlert('메뉴명을 입력해주세요.'); return; }
  const rec = {
    name: serviceMenuDraft.name.trim(),
    category: serviceMenuDraft.category,
    description: (serviceMenuDraft.description||'').trim(),
    qtyPerPerson: serviceMenuDraft.qtyPerPerson,
    unit: serviceMenuDraft.unit,
    costPerPerson: serviceMenuDraft.costPerPerson,
    ingId: serviceMenuDraft.ingId,
    url: (serviceMenuDraft.url||'').trim(),
    isActive: serviceMenuDraft.isActive !== false,
  };
  if(serviceMenuDraft.id){ await updateServiceMenuRec(serviceMenuDraft.id, rec); }
  else { await addServiceMenuRec(rec); }
  serviceMenuDraft = null;
  orderDraft = null;
  render();
}
async function toggleServiceMenuActive(id, val){ await updateServiceMenuRec(id, {isActive: !!val}); orderDraft=null; render(); }
/** 용역부 추가 메뉴 삭제 — 이미 식단에 넣어둔 날이 있으면 알려주고 함께 정리한다. */
async function removeServiceMenu(id){
  const sm = serviceMenuById(id);
  const usedDates = Object.keys(S.serviceMeals).filter(k=>{
    const rec = S.serviceMeals[k];
    return rec && ([...(rec.dessertIds||[]), ...(rec.snackIds||[])].includes(id));
  });
  const msg = usedDates.length
    ? `"${sm?sm.name:''}" 메뉴를 삭제할까요?\n\n현재 불러온 기간의 용역부 식단 ${usedDates.length}일에 들어가 있어, 삭제하면 그 날짜에서도 함께 빠집니다.`
    : `"${sm?sm.name:''}" 메뉴를 삭제할까요?`;
  if(!await customConfirm(msg)) return;
  for(const k of usedDates){
    const rec = S.serviceMeals[k];
    await saveServiceMeal(k, {
      ...rec,
      dessertIds: (rec.dessertIds||[]).filter(x=>x!==id),
      snackIds: (rec.snackIds||[]).filter(x=>x!==id),
    });
  }
  await deleteServiceMenuRec(id);
  orderDraft = null;
  render();
}

      </div>

          <select onchange="serviceMenuDraftLinkProduct(this.value)">

        : `실제 구매상품을 연결하면 1인 비용이 자동 계산되고, 재료구매(발주) 집계에도 그 상품으로 합산됩니다. 연결하지 않으면 입력한 1인 비용만 사용합니다.`}</p>
      <div class="flex-between">

        <div class="chip-row">

}

}

/* ===================== 화면 밝기(테마) 선택 =====================
 * 자동 : 기기(윈도우·맥·브라우저)의 다크모드 설정을 그대로 따라감 — 기본값
 * 밝게 / 어둡게 : 기기 설정과 무관하게 고정. 선택은 그 브라우저에만 기억된다(사람마다 다르게 볼 수 있음).
 * CSS는 이미 :root[data-theme="dark"] / :root:not([data-theme="light"]) 규칙을 갖고 있어
 * 여기서는 html 태그의 data-theme 속성만 바꿔주면 된다. */
const THEME_KEY = 'meal_app_theme_mode';
function currentThemeMode(){
  try{ const v = localStorage.getItem(THEME_KEY); if(v==='light'||v==='dark'||v==='auto') return v; }catch(e){}
  return 'auto';
}
function applyThemeMode(mode){
  const root = document.documentElement;
  if(mode==='auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', mode);
  document.querySelectorAll('#themeToggle button').forEach(b=>b.classList.toggle('active', b.dataset.themeMode===mode));
}
function setThemeMode(mode){
  try{ localStorage.setItem(THEME_KEY, mode); }catch(e){}
  applyThemeMode(mode);
}

/* ===================== 시작 ===================== */
/** 로그인·승인을 통과한 뒤에 실제 앱 데이터를 불러온다.
 *  시드·보정처럼 데이터베이스에 "쓰는" 단계는 수정 권한이 있는 계정에서만 실행한다
 *  (일반 계정이 실행하면 서버 보안 규칙에 막혀 오류가 나고, 애초에 쓸 이유도 없다). */
async function startApp(){
  if(appStarted){ setTab(canViewTab(activeTab) ? activeTab : 'dashboard'); return; }
  appStarted = true;
  const writable = canEdit();
  if(writable) await ensureSeeded();
  await loadCore();
  rebuildCatsThemes();
  if(writable){
    await ensureServiceSettings();
    // ensureExtra*는 예전 Artifact 데이터베이스를 채워주던 보정 단계다.
    // 스냅샷으로 시작했거나 데이터를 가져온 데이터베이스에서는 돌리지 않는다 —
    // 돌리면 사용자가 일부러 지운 메뉴·재료가 다시 살아난다.
    if(!(S.settings && S.settings.snapshotSeeded)){
      await ensureExtraMenus();
      await ensureExtraSuppliers();
      await ensureExtraIngredients();
    }
  }
  await ensureWeekLoaded(currentWeekMonday);
  setTab('dashboard');
}
(async function boot(){
  applyThemeMode(currentThemeMode());
  await initDb();
  document.getElementById('dbstatus').textContent =
    AUTH_ENABLED ? '🔒 로그인 · 실시간 저장 연결됨'
    : (db && !db.__local) ? '☁ 실시간 저장 연결됨'
    : '⚠ 이 브라우저에만 저장됩니다';
  if(AUTH_ENABLED){
    setAuthMode('login');
    fbAuth.onAuthStateChanged(async (user)=>{
      try{
        if(user) await handleSignedIn(user);
        else await handleSignedOut();
      }catch(e){
        console.error('[meal] 로그인 처리 실패', e);
        showAuthGate('form');
        showAuthMsg('로그인 처리 중 문제가 발생했습니다. ' + ((e && e.message) || ''));
      }
    });
    return;
  }
  // Firebase를 아직 연결하지 않은 상태(Artifact 판 / 브라우저 저장 모드) — 예전처럼 로그인 없이 바로 시작.
  hideAuthGate();
  applyNavPermissions();
  await startApp();
})();

</script>
